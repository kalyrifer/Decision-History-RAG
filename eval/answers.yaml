- id: G01
  question: Почему ядро pydantic переписали с Cython на Rust в версии 2?
  expected_summary: Cython-сборки были громоздкими (проблемы с флагами компиляции
    и размером), при v2 ядро выделили в отдельный пакет pydantic-core на Rust ради
    скорости валидации; обязательность Rust-компонента вызывала споры (портативность,
    Lambda), но выбор остался из-за производительности.
  answer: '### 1. Original Problem


    В версии 1.x ядро валидации pydantic было написано на Cython, что приводило к
    ряду проблем, описанных в issue и комментариях в репозитории. Эти проблемы стали
    мотивацией для перехода на Rust в pydantic 2.


    Ключевые исходные жалобы (зафиксированные в evidence):


    - Размер скомпилированных артефактов: `pip install pydantic` даёт ~80M, тогда
    как `conda install` — ~6.6M (https://github.com/pydantic/pydantic/issues/2276,
    peterroelants, 2021-01-20).

    - Проблемы с ABI/совместимостью Cython-расширений при апгрейдах CPython и невозможность
    собрать/запустить на нестандартных реализациях Python: https://github.com/pydantic/pydantic/issues/4790
    (KOLANICH, 2022-11-26).

    - Проблемы с импортом и хрупкость ABI-совместимых сборок (https://github.com/pydantic/pydantic/issues/584,
    mivade, 2019-06-09).


    ### 2. Alternatives Considered


    - **Сохранить Cython** — отвергнут из-за перечисленных выше проблем с ABI, размером
    и переносимостью.

    - **Чистый Python** (валидация без нативного ядра) — поднимался KOLANICH в https://github.com/pydantic/pydantic/issues/4790
    как радикальный способ избавиться от необходимости Rust toolchain у пользователей;
    отвергнут по соображениям производительности.

    - **Rust (pydantic-core)** — выбран как компромисс: сохраняет нативную скорость,
    но даёт лучший контроль над ABI и совместимостью. KOLANICH в issue #4790 протестует
    против этого выбора, но решение принято в пользу Rust.


    ### 3. Arguments For/Against


    За переход на Rust (фигурирует в косвенных формулировках — решения о Pydantic
    V2 принимались командой):


    - Подразумевается, что V2 должен был стать «Pydantic v2 = полностью переписанный,
    на Rust для скорости» (это известная цель проекта, в evidence явно не цитируется,
    но де-факто закреплено введением отдельного репозитория pydantic-core).


    Против (Rust как обязательная зависимость):


    - KOLANICH: «While I can understand that implementing something in Rust can have
    a benefit of it working faster, but it has grave drawbacks too. … If something
    is implemented in Rust, one needs Rust toolchain to build it from source. And
    the toolchain is quite large.» (https://github.com/pydantic/pydantic/issues/4790).

    - Дополнительная боль, ставшая реальной после перехода: колеса pydantic-core могут
    отсутствовать для свежих версий CPython. Tromador: «As of 27th March release,
    I found that latest pydantic-core was failing to install due to lack of wheels
    and wanting to build at install time.» (https://github.com/pydantic/pydantic/issues/13005,
    2026-03-31).

    - dvzrv фиксирует операционную боль для дистрибутивов: «On Arch Linux, we are
    building from upstream source … not from PyPI releases, because those are often
    broken or incomplete and harder to patch.» (https://github.com/pydantic/pydantic/issues/13071,
    2026-04-14).

    - davnat: при отсутствии колеса пользователь получает непрозрачный build-ошибок,
    а не внятное сообщение о несовместимости Python-версии (https://github.com/pydantic/pydantic/issues/13293,
    2026-06-09).


    ### 4. Decision


    Решение: для Pydantic V2 валидационное ядро переписать на Rust и вынести в отдельный
    пакет `pydantic-core` (расположенный в отдельном репозитории `pydantic/pydantic-core`).
    Это зафиксировано фактом существования пакета `pydantic-core` (см. https://github.com/pydantic/pydantic/issues/6450,
    2023-07-05, где обсуждается версия `pydantic_core 2.0.2` и требование `pydantic==2.0.1
    → pydantic-core==2.0.2`). Прямая цитата лица, принявшего решение, в evidence отсутствует
    — ответственность лежит на команде pydantic (Samuel Colvin, David Hewitt, Victorien
    и др.).


    ### 5. Implementation


    - Введение отдельного Rust-пакета `pydantic-core` с жёсткой версионной привязкой
    от `pydantic` (закреплено в `pyproject.toml` — упоминается в https://github.com/pydantic/pydantic/issues/13071:
    «The pydantic release 2.13.0 appears to require a pydantic_core 2.46.0»).

    - Добавление `pydantic-core` в `version-info`: PR https://github.com/pydantic/pydantic/pull/5424
    (samuelcolvin, 2023-04-10) и коммит https://github.com/pydantic/pydantic/commit/c206df4e49a13937621420232629c9ef35483b29.

    - Дальнейшее развитие шло уже в репозитории `pydantic/pydantic-core`, например
    фикс `_pydantic_core.pyi`: https://github.com/pydantic/pydantic/commit/3409314dd967c8674ab99c848932a608933bb21c
    (David Hewitt, 2023-07-05; ссылается на оригинальный коммит pydantic-core).

    - Помощь дистрибутивам/пользователям: PR https://github.com/pydantic/pydantic/pull/11324
    добавляет `check_pydantic_core_version()` (Viicos, 2025-01-23, закрывает https://github.com/pydantic/pydantic/issues/11323)
    — именно как ответ на проблемы «версия pydantic-core не та, что ожидается».


    ### 6. Current State


    - `pydantic-core` (Rust) де-факто остаётся обязательным ядром валидации; от него
    не отказались.

    - Репозиторий `pydantic-core` впоследствии был влит обратно в `pydantic` (PR https://github.com/pydantic/pydantic/pull/12423,
    davidhewitt, 2025-10-19; затем https://github.com/pydantic/pydantic/pull/12431
    и https://github.com/pydantic/pydantic/pull/12436 с переписанными commit messages)
    и, по словам dvzrv в https://github.com/pydantic/pydantic/issues/13071, «the pydantic-core
    repository is now archived and its sources have been moved to this repository
    instead». Развитие продолжается внутри монорепы (например, https://github.com/pydantic/pydantic/pull/12508
    — dependabot bump `url` 2.5.4→2.5.7; миграция CI https://github.com/pydantic/pydantic/pull/12752,
    Viicos, 2026-01-28; коммит https://github.com/pydantic/pydantic/commit/3db1cc52d51db0c0648f32b85884ef18283111ed,
    2025-11-19).

    - Сохраняются операционные проблемы, прямо вызванные Rust-зависимостью: отсутствие
    колес под свежий CPython (https://github.com/pydantic/pydantic/issues/13005),
    поломка Homebrew на macOS 15 из-за линковки (https://github.com/pydantic/pydantic/issues/13136,
    washingtoneg, 2026-05-01), отсутствие тегов для версий pydantic-core в монорепе
    (https://github.com/pydantic/pydantic/issues/13071), непрозрачные сообщения об
    ошибках при отсутствии колес (https://github.com/pydantic/pydantic/issues/13293,
    2026-06-09).


    ### 7. Confidence & Gaps


    Confidence: **medium-high** относительно самого факта перехода на Rust и его обоснования
    (производительность, ABI-контроль), но **low-medium** относительно деталей внутренней
    дискуссии.


    Чего не хватает в evidence:

    - Прямой цитаты основателя/мейнтейнера с явной формулировкой «мы переходим на
    Rust вместо Cython по причинам X, Y, Z» (например, оригинального анонса Pydantic
    V2). В предоставленных блоках есть только косвенные следы (https://github.com/pydantic/pydantic/issues/6450,
    https://github.com/pydantic/pydantic/pull/5424).

    - Сравнительных бенчмарков Cython vs Rust, обсуждавшихся при принятии решения.

    - Явного ADR или GitHub-обсуждения, в котором сравнивались именно варианты «оставить
    Cython», «чистый Python», «Rust». Известно лишь, что KOLANICH в https://github.com/pydantic/pydantic/issues/4790
    предлагал убрать обязательный нативный компонент вовсе, но это не было принято.'
