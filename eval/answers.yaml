- id: G04
  question: Как и почему в pydantic появились discriminated unions?
  expected_summary: Запрос пришёл из потребности валидировать union-типы по тегу как
    в OpenAPI 3 (#619, долгий тред); дизайн обсуждался годами, реализовано через Literal/Discriminator
    в v2.
  answer: '### 1. Original Problem


    В Pydantic V1 поддержка `typing.Union` покрывала далеко не все случаи спецификаций
    JSONSchema и OpenAPI. В частности, OpenAPI поддерживает **tagged unions** с полем-дискриминатором,
    но Pydantic не умел ни валидировать входящие JSON-данные по такому полю, ни генерировать
    корректный JSON-схема-объект с `oneOf` и `discriminator`.


    Оригинальный запрос — feature request [sm-Fifteen в issue #619](https://github.com/pydantic/pydantic/issues/619)
    (2019-06-24):


    > "Pydantic currently has a decent support for union types through the `typing.Union`
    type from PEP484, but it does not currently cover all the cases covered by the
    JSONSchema and OpenAPI specifications… OpenAPI supports something similar to tagged
    unions where a certain field is designated to serve as a ''discriminator''."


    Предлагался API вроде:

    ```py

    MyTaggedUnion = TaggedUnion(Union[Foo, Bar], discriminator=''type'', mapping={''foo'':
    Foo, ''bar'': Bar})

    ```


    ### 2. Alternatives Considered


    - **Расширить `Field`** параметрами `discriminator`/`mapping` (вариант в issue
    [#619](https://github.com/pydantic/pydantic/issues/619)): "discriminator and mapping
    could also simply be added to Schema".

    - **PEP 593 (`Annotated`)** как механизм аннотирования обычного `Union` метаданными,
    специфичными для Pydantic (тоже упомянут в [#619](https://github.com/pydantic/pydantic/issues/619)).
    На момент 2019 — ещё драфт, риск непринятия.

    - **Conditional types из JSON Schema draft 7+** (тоже [#619](https://github.com/pydantic/pydantic/issues/619)):
    автор сам отметил, что они несовместимы с подходом OpenAPI.

    - **`TaggedUnion`-обёртка как отдельный тип** — исходное предложение автора [#619](https://github.com/pydantic/pydantic/issues/619).

    - В итоге был выбран **компромисс: `Annotated[Union[...], Field(discriminator=...)]`**
    — сочетание `Annotated` из PEP 593 и `Field`.


    ### 3. Arguments For/Against


    - **За PEP 593 / `Annotated`:** уже получил широкую поддержку в сообществе к моменту
    реализации; даёт совместимость со стандартным `typing.Union` без введения новых
    типов; этот путь фактически и закрепился.

    - **Против OpenAPI-специфичных расширений в `Schema`:** автор [#619](https://github.com/pydantic/pydantic/issues/619)
    сам сомневался: "I''m not sure about whether it''s a good idea to add OpenAPI-specific
    extensions there."

    - **Против полного дублирования через `TaggedUnion`-обёртку:** создаёт новый тип,
    который параллелен `typing.Union`, что усложняет интеграцию с уже существующими
    инструментами.

    - В PR [#2336](https://github.com/pydantic/pydantic/pull/2336) PrettyWood обозначила
    рамки: добавить discriminated unions + поддержать соответствующую часть OpenAPI-спецификации,
    закрыв #619 и #3113.


    ### 4. Decision


    Был реализован механизм `Annotated[Union[...], Field(discriminator=...)]` — значение
    дискриминатора задаётся строкой (именем поля), а маппинг значений литералов в
    варианты `Union` строится автоматически на основе `Literal[...]` в вариантах.
    Решение зафиксировано в PR [#2336](https://github.com/pydantic/pydantic/pull/2336)
    — "Support discriminated union" авторства PrettyWood, который закрывает [#619](https://github.com/pydantic/pydantic/issues/619)
    и [#3113](https://github.com/pydantic/pydantic/issues/3113).


    ### 5. Implementation


    - **[PR #2336](https://github.com/pydantic/pydantic/pull/2336)** — "Support discriminated
    union" (PrettyWood, 2021-02-09). Добавляет поддержку discriminated unions и OpenAPI
    discriminator, закрывает #619 и #3113.

    - **[PR #6405](https://github.com/pydantic/pydantic/pull/6405)** — "Allow single-item
    discriminated unions" (dmontagu, 2023-07-03). Разрешает `Annotated[Union[T], Field(discriminator=...)]`
    с одним вариантом; dmontagu отметил: "I don''t see any reason we should error
    if you produce a single-item discriminated union."


    ### 6. Current State


    Судя по issue-трекеру, поддержка есть, но вокруг неё продолжают возникать баги
    и несовершенства:


    - Ошибки локации в ValidationError включают имя подтипа — [#3947](https://github.com/pydantic/pydantic/issues/3947).

    - Некорректная генерация OpenAPI-схемы при Enum-значениях литерала — [#4337](https://github.com/pydantic/pydantic/issues/4337)
    (V1) и [#7491](https://github.com/pydantic/pydantic/issues/7491) (V2, nested unions).

    - Генерация nested OpenAPI discriminator для вложенных unions — [#5436](https://github.com/pydantic/pydantic/issues/5436)
    (V1).

    - Регрессия 2.6.3 → 2.6.4 в сложных дженериках — [#9118](https://github.com/pydantic/pydantic/issues/9118).

    - При сбое валидации дискриминатора ошибки всё равно выдаются по всем вариантам
    — [#9498](https://github.com/pydantic/pydantic/issues/9498).

    - Регрессия 2.9: warning "Failed to get discriminator value for tagged union serialization"
    при `model_dump` после `model_validate` — [#10355](https://github.com/pydantic/pydantic/issues/10355).

    - `validate_call` игнорирует дискриминатор — [#10569](https://github.com/pydantic/pydantic/issues/10569).

    - Плохие сообщения об ошибках при использовании `type` statement (PEP 695) — [#11043](https://github.com/pydantic/pydantic/issues/11043):
    ошибка `tagged-union[union[A,B],union[A,B]]` вместо `tagged-union[A,B]`.

    - `type Pet = Cat | Dog` (PEP 695) ломает дискриминацию — [#12771](https://github.com/pydantic/pydantic/issues/12771):
    ttencate сообщает, что "validators to run for all union members" при использовании
    type alias.


    То есть сама фича живёт и широко используется (в FastAPI и др.), но полировка
    вокруг неё продолжается.


    ### 7. Confidence & Gaps


    **Confidence: high** — основная цепочка (issue #619 → PR #2336) хорошо прослеживается
    по evidence.


    **Gaps:**

    - В evidence нет подробной дискуссии по дизайну внутри PR #2336 — неизвестно,
    какие именно альтернативы обсуждались в review (только общая рамка от автора PR).

    - Не видно отдельного ADR или комментария мейнтейнера, фиксирующего, *почему*
    был выбран именно `Annotated[Union, Field(discriminator=...)]` — решение восстанавливается
    косвенно по содержимому PR.

    - Для V2 не зафиксирован момент переезда на `Discriminator`/`Tag`-обёртки (видно
    в [#10355](https://github.com/pydantic/pydantic/issues/10355) в коде примера),
    но прямой ссылки на вводящий их issue/PR в evidence нет.'
