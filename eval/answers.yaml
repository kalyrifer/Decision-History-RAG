- id: G02
  question: Почему pydantic не использует строгий режим валидации по умолчанию?
  expected_summary: 'Сознательная философия проекта: lax-режим по умолчанию ради удобства
    работы с реальными данными, strict доступен как конфигурация (#1098); позиция
    зафиксирована в раннем issue о назначении pydantic (#578).'
  answer: "Pydantic намеренно использует либеральный (lax) режим парсинга по умолчанию\
    \ вместо строгой валидации, потому что изначально позиционирует себя как parsing\
    \ library, а не validation library: гарантируется форма выходных данных, а не\
    \ проверка входных. Со временем, однако, появился отдельный strict-режим как опция\
    \ для тех, кому важна именно строгость типов.\n\n**Главные причины решения**\n\
    \n1. **Философия «парсинг, а не валидация»**\n   - Самюэль Колвин закрепил эту\
    \ позицию ещё в 2019 году: Pydantic не даёт гарантий о форме входных данных, но\
    \ гарантирует форму результата.\n   - Автор: *\"Pydantic is not a validation library,\
    \ it's a parsing library. It makes no guarantee whatsoever about checking the\
    \ form of data you give to it; instead it makes a guarantee about the form of\
    \ data you get out of it.\"* (Issue #578)\n   - Практические следствия:\n    \
    \ - строка `\"3\"` для поля `int` будет преобразована в `3`\n     - `3.14` для\
    \ поля `int` будет усечено до `3` («loosing information»)\n     - лексическое\
    \ удобство: грязные данные из JS-клиентов или публичных API можно сразу парсить\
    \ без предварительной очистки\n\n2. **Обратная совместимость и эргономика по умолчанию**\n\
    \   - Многие пользователи полагаются на coercing-поведение, и смена дефолта сломала\
    \ бы их код без явной миграции.\n   - В Issue #6045 (vitalik, 2023) описано, что\
    \ int→str coercion в V1 был «very handy when dealing with parsing data of a public\
    \ API where users send messy data from JS client sides» — то есть lax-режим закрывает\
    \ реальный сценарий использования.\n   - Альтернатива (`Strict*`-типы, такие как\
    \ `StrictFloat`, `StrictBool`, `StrictInt`) была введена ещё в V1 как opt-in решение\
    \ для тех, кому строгость нужна (#579, #1098).\n\n3. **Сложность и стоимость глобального\
    \ переключения**\n   - В Issue #1098 (maxrothman, 2019) отмечалось, что реализация\
    \ strict-флага требует условной пересборки `validators._VALIDATORS` и отдельных\
    \ путей для bool/int edge cases.\n   - В Issue #4664 (samuelcolvin, 2022) при\
    \ подготовке V2 признавалось: *«pydantic-core can switch from strict to lax mode\
    \ at validation time… however unfortunately I very much doubt that will be possible\
    \ in pydantic — many of the schemas will need to be different for strict and lax\
    \ mode.»*\n   - Переименование `validate_model` → `parse_model` или `__get_validators__`\
    \ → `__get_parser_functions__` было отвергнуто как «big, backwards incompatible\
    \ change for no material benefit» (#578).\n\n4. **Strict-режим всё же появился,\
    \ но только как опция**\n   - В V2 был введён `ConfigDict(strict=True)` и `Field(strict=False/True)`\
    \ как рекомендованный путь (#7268, #10205).\n   - В Issue #11273 (2025) пользователь\
    \ предлагает сделать strict валидацией дефолтов — это остаётся открытым философским\
    \ вопросом («This is its philosophy» — ответ пока не дан).\n   - Обнаруженные\
    \ баги (#7268, #7468, #8147, #9204, #11681, #10205) показывают, что strict-режим\
    \ сам по себе сложен и нестабилен, что делает его включение по умолчанию рискованным.\n\
    \n**Хронология**\n\n- 2017-06-21 — PR #52: ужесточение str-валидации через whitelist\
    \ коэрсируемых значений\n- 2019-06-05 — Issue #578: официальная фиксация позиции\
    \ «parsing, not validation»\n- 2019-06-05 — Issue #579: запрос `StrictBool`\n\
    - 2019-12-15 — Issue #1098: запрос глобального strict-режима как config-флага\n\
    - 2021-09-14 — Issue #3208: альтернативное предложение — переопределение дефолтных\
    \ валидаторов\n- 2022-10-27 — Issue #4664: план по strict-режиму в V2 (`model_lax()`,\
    \ `model_strict()`)\n- 2023-06-08 — Issue #6045: ностальгия по int→str coercion\
    \ из V1\n- 2023-07-22 — Issue #6802: обнаружение strict-режима внутри `Annotated`\
    \ валидаторов\n- 2023-08-28 — Issue #7268: баг `Field(strict=False)` для `Path`\n\
    - 2023-09-16 — Issue #7468: конфликт `model_validator(mode=\"after\")` с strict-режимом\n\
    - 2023-11-16 — Issue #8147: проблема strict-режима с `mode='wrap'`\n- 2023-11-28\
    \ — Issue #8244: запрос strict-режима для `HttpUrl`\n- 2024-04-10 — Issue #9204:\
    \ регрессия strict + tuple + `mode=\"before\"`\n- 2024-06-08 — Issue #9589: побочный\
    \ эффект `model_validator(mode=\"before\")` между классами\n- 2024-08-21 — Issue\
    \ #10205: strict не работает для `RootModel` полей\n- 2025-01-15 — Issue #11273:\
    \ запрос strict-валидации дефолтов по умолчанию\n- 2025-04-02 — Issue #11681:\
    \ регрессия 2.11 — strict ломает `max_length`\n\n**Источники**\n\n- Issue #578\
    \ — официальное обоснование «parsing, not validation» — [github.com/pydantic/pydantic/issues/578](https://github.com/pydantic/pydantic/issues/578)\n\
    - Issue #1098 — запрос strict-режима как config-флага и анализ сложности — [github.com/pydantic/pydantic/issues/1098](https://github.com/pydantic/pydantic/issues/1098)\n\
    - Issue #4664 — план реализации strict-режима в V2 — [github.com/pydantic/pydantic/issues/4664](https://github.com/pydantic/pydantic/issues/4664)\n\
    - Issue #6045 — практический аргумент за lax по умолчанию (int→str coercion) —\
    \ [github.com/pydantic/pydantic/issues/6045](https://github.com/pydantic/pydantic/issues/6045)\n\
    - Issue #3208 — альтернативный взгляд: переопределение дефолтных валидаторов —\
    \ [github.com/pydantic/pydantic/issues/3208](https://github.com/pydantic/pydantic/issues/3208)\n\
    - Issue #11273 — актуальный запрос на строгую валидацию дефолтов — [github.com/pydantic/pydantic/issues/11273](https://github.com/pydantic/pydantic/issues/11273)\n\
    - Issue #11681 — пример регрессии strict-режима в 2.11 — [github.com/pydantic/pydantic/issues/11681](https://github.com/pydantic/pydantic/issues/11681)\n\
    \n**Оговорка о полноте:** В evidence нет прямого утверждения мейнтейнеров «мы\
    \ никогда не сделаем strict дефолтом»; вывод основан на устойчивой позиции из\
    \ #578, технической сложности из #4664, и на том, что V2 оставил strict как опцию.\
    \ Дискуссия в #11273 остаётся открытой, поэтому финальное решение по дефолтам\
    \ ещё может измениться."
