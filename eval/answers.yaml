- id: G04
  question: Как и почему в pydantic появились discriminated unions?
  expected_summary: Запрос пришёл из потребности валидировать union-типы по тегу как
    в OpenAPI 3 (#619, долгий тред); дизайн обсуждался годами, реализовано через Literal/Discriminator
    в v2.
  answer: "Pydantic изначально поддерживал только обычные `typing.Union`, что не покрывало\
    \ OpenAPI-спецификацию для tagged unions с дискриминатором, а валидация по `Union`\
    \ была медленной и давала плохие сообщения об ошибках. В 2021 году PrettyWood\
    \ закрыл давний issue #619, добавив поддержку `Field(discriminator=...)`, а в\
    \ V2 эта функциональность была переработана и расширена через `Discriminator`,\
    \ `Tag` и `Annotated`.\n\n**Главные причины решения**\n\n1. **Необходимость совместимости\
    \ с OpenAPI 3**\n   - Стандарт OpenAPI требует «discriminator object», где одно\
    \ поле-метка определяет, какую из схем `oneOf` использовать.\n   - sm-Fifteen\
    \ в issue #619 писал: *\"OpenAPI supports something similar to tagged unions where\
    \ a certain field is designated to serve as a 'discriminator'... which is then\
    \ matched against literal values to determine which of multiple schemas to use\
    \ for payload validation.\"*\n   - Без этой поддержки FastAPI и другие инструменты\
    \ не могли корректно генерировать OpenAPI-схемы для гетерогенных структур.\n\n\
    2. **Производительность валидации union-типов**\n   - dmontagu в issue #5163 объяснял:\
    \ «it may be (significantly) more performant to use the TaggedUnionSchema validation\
    \ logic... it will ensure that the item is validated against the correct schema\
    \ within the union choices immediately» — обычная union-валидация перебирала все\
    \ варианты, что медленно.\n   - Это побудило добавить `Field(discriminator=...)`,\
    \ а в V2 — API `Annotated[Union[...], Discriminator(...)]` для выбора нужной ветви\
    \ по одному полю.\n\n3. **Более качественные сообщения об ошибках**\n   - sm-Fifteen\
    \ в #619 подчёркивал, что Pydantic должен «correctly validate incoming JSON into\
    \ the correct type based on the value or the discriminator field», а не выдавать\
    \ кашу из ошибок всех вариантов.\n   - Это подтверждается дальнейшими багами:\
    \ #9498 (irrelevant errors при неверном дискриминаторе), #11043 (плохие пути в\
    \ ошибках для `type`-statement), #3947 (subtype в error location).\n\n4. **Идиоматический\
    \ Python API**\n   - В V1 использовался `Field(discriminator='type')`, но это\
    \ плохо ложилось на type-checker'ы. PrettyWood в PR #2336 добавил дискриминатор\
    \ как часть Field, а позже в V2 появились отдельные `pydantic.Discriminator` и\
    \ `pydantic.Tag` для `Annotated[...]`, что сделало API типизируемым и совместимым\
    \ с PEP 593.\n\n**Хронология**\n\n- 2019-06-24 — Feature request на discriminated\
    \ unions в Pydantic [issue #619](https://github.com/pydantic/pydantic/issues/619)\n\
    - 2021-02-09 — PR #2336 от PrettyWood добавляет `Field(discriminator=...)` и OpenAPI\
    \ discriminator object [PR #2336](https://github.com/pydantic/pydantic/pull/2336)\n\
    - 2022-03-28 — Issue #3947: ошибки в discriminated union содержат имя subtype\
    \ в error location [issue #3947](https://github.com/pydantic/pydantic/issues/3947)\n\
    - 2022-08-06 — Issue #4337: схема не генерируется для `Literal[Enum]` дискриминаторов\
    \ [issue #4337](https://github.com/pydantic/pydantic/issues/4337)\n- 2023-03-09\
    \ — Issue #5163: предложение автоматически выводить дискриминатор для производительности\
    \ [issue #5163](https://github.com/pydantic/pydantic/issues/5163)\n- 2023-04-11\
    \ — Issue #5436: OpenAPI-схема ломается на nested discriminated unions в V1 [issue\
    \ #5436](https://github.com/pydantic/pydantic/issues/5436)\n- 2023-07-03 — PR\
    \ #6405 от dmontagu разрешает single-item discriminated unions [PR #6405](https://github.com/pydantic/pydantic/pull/6405)\n\
    - 2023-07-04 — Issue #6435: повторное применение дискриминатора к tagged-union\
    \ падает [issue #6435](https://github.com/pydantic/pydantic/issues/6435)\n- 2023-09-18\
    \ — Issue #7491: та же проблема nested unions воспроизводится в V2 [issue #7491](https://github.com/pydantic/pydantic/issues/7491)\n\
    - 2024-03-27 — Issue #9118: регрессия в V2.6.4 с generic discriminated union [issue\
    \ #9118](https://github.com/pydantic/pydantic/issues/9118)\n- 2024-05-25 — Issue\
    \ #9498: union discriminator выдаёт errors от всех вариантов [issue #9498](https://github.com/pydantic/pydantic/issues/9498)\n\
    - 2024-09-09 — Issue #10355: warning при сериализации tagged union в V2.9 [issue\
    \ #10355](https://github.com/pydantic/pydantic/issues/10355)\n- 2024-10-08 — Issue\
    \ #10569: `validate_call` игнорирует discriminated unions [issue #10569](https://github.com/pydantic/pydantic/issues/10569)\n\
    - 2024-12-03 — Issue #11043: плохие error messages при `type`-statement discriminated\
    \ union [issue #11043](https://github.com/pydantic/pydantic/issues/11043)\n- 2026-02-05\
    \ — Issue #12771: tagged union type-alias запускает валидаторы всех членов [issue\
    \ #12771](https://github.com/pydantic/pydantic/issues/12771)\n\n**Источники**\n\
    \n- Оригинальный feature request с обоснованием совместимости с OpenAPI 3 — [issue\
    \ #619](https://github.com/pydantic/pydantic/issues/619)\n- Первый PR, реализовавший\
    \ `Field(discriminator=...)` и закрывший #619 и #3113 — [PR #2336](https://github.com/pydantic/pydantic/pull/2336)\n\
    - Обоснование добавления авто-вывода дискриминатора для производительности — [issue\
    \ #5163](https://github.com/pydantic/pydantic/issues/5163)\n- PR, разрешивший\
    \ single-item discriminated unions — [PR #6405](https://github.com/pydantic/pydantic/pull/6405)\n\
    - Регрессия при повторном применении дискриминатора к tagged-union — [issue #6435](https://github.com/pydantic/pydantic/issues/6435)\n\
    - Проблема генерации OpenAPI для nested discriminated unions в V2 — [issue #7491](https://github.com/pydantic/pydantic/issues/7491)\n\
    - Реальный кейс с warning \"Failed to get discriminator value for tagged union\
    \ serialization\" в V2.9 — [issue #10355](https://github.com/pydantic/pydantic/issues/10355)\n\
    - Пример бага с `type`-statement, дающего двойную вложенность `tagged-union[union[A,B],union[A,B]]`\
    \ — [issue #11043](https://github.com/pydantic/pydantic/issues/11043)"
