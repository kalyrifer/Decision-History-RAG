- id: G08
  question: Зачем в pydantic отдельный StrictBool — чем обычный bool не устроил?
  expected_summary: bool в Python является подклассом int, из-за чего lax-валидация
    пропускала числа там, где ожидался флаг; StrictBool отделил настоящие boolean
    от числовых (#579).
  answer: "Отдельный тип `StrictBool` в pydantic появился, потому что стандартный\
    \ `bool` в Python — это, по сути, обёртка над `int`, и любой объект в ней преобразуется\
    \ в `True`/`False` по «truthy»-логике. Авторы pydantic сознательно выбрали pydantic\
    \ как **parsing-библиотеку**, а не validation (см. issue #578), поэтому по умолчанию\
    \ `bool` принимает строки, числа и даже dict'ы, превращая их в булевы значения\
    \ — а это для многих пользователей (особенно при работе с API и базами данных)\
    \ неприемлемо. `StrictBool` решает эту проблему, принимая только настоящие `bool`\
    \ (или ограниченный набор очевидных строк вроде `\"true\"/\"false\"/\"1\"/\"0\"\
    `).\n\n**Главные причины решения**\n\n1. **Python'овский `bool` слишком «всеяден»\
    \ и теряет тип данных**\n   - В Python `bool({\"moo\": 1}) == True`, `bool(\"\
    snap\") == True`, поэтому валидация pydantic с типом `bool` пропускала любой ввод\
    \ без ошибки.\n   - Из-за этого модель с `a: bool` принимала `1`, `\"snap\"` и\
    \ dict'ы, что ломало downstream-логику: база данных падала, типы терялись, `Union[int,\
    \ bool, str]` невозможно было корректно десериализовать обратно в исходный тип.\n\
    \   - cazgp: *\"I cannot think of a single type that can be passed to `bool(X)`\
    \ that won't return a boolean, and yet `bool_validator` returns that coercion.\
    \ e.g. `bool({\"moo\": 1}) == True`. This makes the validator completely useless\"\
    * — [#579](https://github.com/pydantic/pydantic/issues/579).\n\n2. **Авторы закрепили\
    \ идеологию «parse, not validate», но дали опцию строгой проверки**\n   - В [#578](https://github.com/pydantic/pydantic/issues/578)\
    \ Samuel Colvin явно сформулировал: pydantic — это parsing-библиотека, гарантирующая\
    \ форму *выходных* данных, а не форму *входных*. Менять это поведение по умолчанию\
    \ не планировалось.\n   - Решение: сохранить либеральное поведение для `bool`\
    \ (чтобы не ломать обратную совместимость), но добавить opt-in `StrictBool` для\
    \ пользователей, которым нужна настоящая валидация.\n\n3. **Реальные use-кейсы,\
    \ где «всеядность» `bool` мешала работе**\n   - **API и БД**: некорректный тип\
    \ «добирался» до базы и падал уже там — cazgp.\n   - **Union-типы**: `Union[int,\
    \ bool, str]` не позволял сохранить исходный тип поля (issue [#780](https://github.com/pydantic/pydantic/issues/780),\
    \ [#1723](https://github.com/pydantic/pydantic/issues/1723)). haizaar: *\"parse\
    \ `{\"field\": \"foo\"}` as boolean, since `bool` \"eats\" anything\"*.\n   -\
    \ **Строковые значения, похожие на булевы, но ими не являющиеся**: строка `\"\
    NO\"` в Pydantic V2 проходила как `True` (issue [#8863](https://github.com/pydantic/pydantic/issues/8863)).\n\
    \n4. **Дальнейшее развитие strict-проверки в V1 и V2**\n   - В V1 параллельно\
    \ добавили `StrictInt`, `StrictFloat`, `StrictStr`, `StrictBytes` и починили конструкторы\
    \ `Strict*`-типов, чтобы они возвращали базовый тип, а не подкласс (PR [#3885](https://github.com/pydantic/pydantic/pull/3885)\
    \ — исправление `isinstance`, `repr`, `is` проблем из [#2329](https://github.com/pydantic/pydantic/issues/2329)).\n\
    \   - В V2 `StrictBool` стал частью общего механизма strict-режима в `pydantic-core`\
    \ (см. [#4664](https://github.com/pydantic/pydantic/issues/4664) и коммит реализации\
    \ strict-режима Samuel Colvin от 22 апреля 2022).\n\n**Хронология**\n\n- 2019-06-05\
    \ — Issue [#578](https://github.com/pydantic/pydantic/issues/578): samuelcolvin\
    \ закрепляет позицию «parse, not validate».\n- 2019-06-05 — Issue [#579](https://github.com/pydantic/pydantic/issues/579):\
    \ cazgp жалуется на бесполезность `bool_validator` и предлагает `StrictBool`.\n\
    - 2019-06-05 — PR [#580](https://github.com/pydantic/pydantic/pull/580): cazgp\
    \ реализует `StrictBool` (commit [`eb1e640`](https://github.com/pydantic/pydantic/commit/eb1e640525a29f6e4358c767cf3c9232d6801b12)).\n\
    - 2019-06-23 — PR [#617](https://github.com/pydantic/pydantic/pull/617): dmontagu\
    \ делает `bool_validator` чуть строже (yaml/DRF-строки) и предлагает `RelaxedBool`\
    \ как альтернативу.\n- 2019-07-25 — Issue [#690](https://github.com/pydantic/pydantic/issues/690):\
    \ пользователи уточняют, как давать `StrictBool` значение по умолчанию для MyPy.\n\
    - 2019-08-26 — Issue [#780](https://github.com/pydantic/pydantic/issues/780):\
    \ запрос на generic-механизм `Strict<type>` и проблема `Union[int, bool, str]`.\n\
    - 2020-07-14 — Issue [#1723](https://github.com/pydantic/pydantic/issues/1723):\
    \ баг с `Union[int, bool]`, где при `0`/`True` тип не различается.\n- 2021-02-08\
    \ — Issue [#2329](https://github.com/pydantic/pydantic/issues/2329): `StrictBool`\
    \ ломает `repr`, `isinstance`, `is`-проверки — не drop-in replacement.\n- 2022-03-07\
    \ — PR [#3885](https://github.com/pydantic/pydantic/pull/3885): конструкторы `Strict*`\
    \ начинают возвращать базовый тип.\n- 2022-04-22 — Commit [23970fe](https://github.com/pydantic/pydantic/commit/23970fe1f4e6f4bcb95788ac38ad53e770c5c555):\
    \ Samuel Colvin реализует strict-режим в `pydantic-core` для V2.\n- 2022-10-27\
    \ — Issue [#4664](https://github.com/pydantic/pydantic/issues/4664): план по strict-режиму\
    \ для всех V2-типов.\n- 2024-02-21 — Issue [#8863](https://github.com/pydantic/pydantic/issues/8863):\
    \ в V2 `bool` всё ещё пропускает строку `\"NO\"`, и `StrictBool` ведёт себя так\
    \ же — пользователь ожидает, что не-валидные строки должны реджектиться в обоих\
    \ случаях.\n\n**Источники**\n\n- Issue с обоснованием необходимости `StrictBool`\
    \ и минимальным примером — [#579](https://github.com/pydantic/pydantic/issues/579).\n\
    - Идеологическая база: «pydantic — parsing, а не validation» — [#578](https://github.com/pydantic/pydantic/issues/578).\n\
    - Исходный PR, добавивший `StrictBool` в pydantic — [#580](https://github.com/pydantic/pydantic/pull/580);\
    \ соответствующий коммит — [`eb1e640`](https://github.com/pydantic/pydantic/commit/eb1e640525a29f6e4358c767cf3c9232d6801b12).\n\
    - Альтернативное предложение ужесточить сам `bool_validator` (PR с `RelaxedBool`)\
    \ — [#617](https://github.com/pydantic/pydantic/pull/617).\n- Проблема `Union[int,\
    \ bool, str]`, которую решает `StrictBool` — [#780](https://github.com/pydantic/pydantic/issues/780)\
    \ и [#1723](https://github.com/pydantic/pydantic/issues/1723).\n- План развития\
    \ strict-режима для всех типов в V2 — [#4664](https://github.com/pydantic/pydantic/issues/4664);\
    \ реализация в `pydantic-core` — коммит [23970fe](https://github.com/pydantic/pydantic/commit/23970fe1f4e6f4bcb95788ac38ad53e770c5c555).\n\
    - Исправление конструкторов `Strict*`, чтобы они возвращали базовый тип — [#3885](https://github.com/pydantic/pydantic/pull/3885)\
    \ (контекст — [#2329](https://github.com/pydantic/pydantic/issues/2329))."
