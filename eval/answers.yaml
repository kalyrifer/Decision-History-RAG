- id: G07
  question: Как pydantic решил проблему PEP 563 (postponed annotations) и почему именно
    так?
  expected_summary: 'Постponed evaluation ломал интроспекцию аннотаций; позиция мейнтейнеров
    — работать через resolve_annotations и требовать локальные ссылки, аргументация
    в длинном треде #2678.'
  answer: "Pydantic изначально пытался поддержать PEP 563 через эмуляцию отложенных\
    \ аннотаций, но в итоге был вынужден перейти на собственную стратегию ленивого\
    \ разрешения, потому что `typing.get_type_hints()` не справляется со всеми сценариями\
    \ и работает слишком медленно. Главная причина выбранного подхода — необходимость\
    \ сохранить корректную работу библиотеки в реальных проектах (рекурсивные модели,\
    \ dataclasses, NamedTuple, TypedDict, PEP 695), а не полагаться на единственный\
    \ несовершенный механизм стандартной библиотеки.\n\n**Главные причины решения**\n\
    \n1. **PEP 563 делает аннотации строками по умолчанию в Python 3.10, и `typing.get_type_hints()`\
    \ ненадёжен**\n   - Без специальной логики pydantic получает строки вместо типов\
    \ и падает: `RuntimeError: error checking inheritance of ForwardRef('Foo') (type:\
    \ ForwardRef('Foo'))` (issue #234), `RuntimeError: error checking inheritance\
    \ of 'Optional[Foo]' (type: str)` (issue #248).\n   - `typing.get_type_hints()`\
    \ «doesn't work all the time and neither do the numerous hacks we've introduced\
    \ to try and fix it»; samuelcolvin прямо пишет в issue #2678: «Even if `typing.get_type_hints()`\
    \ was faultless, it would still be massively slower than the current semantics\
    \ or PEP 649».\n   - Из-за этого pydantic не может просто полагаться на стандартный\
    \ механизм — нужна собственная реализация.\n\n2. **Разработчики хотели сохранить\
    \ семантику «аннотации — это код», поэтому поддержали и PEP 563, и собственное\
    \ ленивое разрешение**\n   - Уже в pydantic v0.18 (PR #348, коммит 25b5d98, январь\
    \ 2019) была добавлена поддержка `from __future__ import annotations` и `ForwardRef`,\
    \ с методом `Model.update_forward_refs()` для явного резолва.\n   - Автор оригинального\
    \ PR (samuelcolvin) писал: «`ForwardRef` should now be fully supported. If the\
    \ `ForwardRef` can't evaluate when creating the Model you'll need to call `Model.update_forward_refs()`\
    \ after it's been created».\n   - PEP 649 рассматривался как идеальное решение\
    \ («the best of both worlds» — issue #2678), но на момент Python 3.10 его принятие\
    \ было под вопросом, и pydanic не мог зависеть от его утверждения.\n\n3. **Реальные\
    \ случаи продолжали ломаться, что вынудило делать точечные исправления и переходить\
    \ к собственной системе резолва**\n   - Issue #2760 (NamedTuple не резолвится),\
    \ issue #3282 (`Annotated` метаданные теряются после `update_forward_refs`), issue\
    \ #7873 (PEP 604 `int | str` падает на Python 3.8), issue #8475 (не передаётся\
    \ namespace при dataclass + future annotations), issue #8883 (`validate_call`\
    \ неправильно определяет scope), issue #10877 (PEP 695 + `Annotated[Enum]`).\n\
    \   - Решения выпускались как ad-hoc патчи: PR #2761 починил NamedTuple/TypedDict,\
    \ PR #8209 ввёл `eval_type_backport` для обратной совместимости `X | Y`, PR #8513\
    \ исправил namespace для dataclass, в `_internal/_generate_schema.py` появилась\
    \ функция `_resolve_forward_ref`.\n   - Часть багов остаётся открытой даже в V2,\
    \ что показывает фундаментальную сложность задачи.\n\n**Хронология**\n\n- 2018-07-25\
    \ — Issue #234: первое сообщение о том, что `ForwardRef` не резолвится внутри\
    \ `BaseModel`.\n- 2018-08-22 — Issue #248: запрос поддержки `from __future__ import\
    \ annotations` с `typing.get_type_hints()`.\n- 2018-12-29 — PR #348: первая реализация\
    \ поддержки postponed annotations и `ForwardRef` в Python 3.7.\n- 2019-01-11 —\
    \ Commit 25b5d98: «support postponed annotations in python 3.7», включая поддержку\
    \ полного `ForwardRef`, `update_forward_refs` и примеры в доках.\n- 2019-04-23\
    \ — Issue #486: документация по postponed annotations признана непонятной.\n-\
    \ 2021-04-15 — Issue #2678: ключевой пост samuelcolvin о рисках PEP 563 и предпочтении\
    \ PEP 649.\n- 2021-05-07 — Issue #2760: NamedTuple не резолвит postponed annotations.\n\
    - 2021-05-08 — PR #2761: фикс для NamedTuple и TypedDict (через корректную установку\
    \ `__module__`).\n- 2021-10-02 — Issue #3282: `Annotated` метаданные теряются\
    \ после `update_forward_refs`.\n- 2023-10-19 — Issue #7873: `int | str` под `from\
    \ __future__ import annotations` падает на Python 3.8.\n- 2023-11-22 — PR #8209:\
    \ введён `typing_extra.eval_type_backport` для union-оператора в старых Python.\n\
    - 2024-01-02 — Issue #8475: dataclass + future annotations не передаёт namespace\
    \ в pydantic.\n- 2024-01-08 — PR #8513: фикс передачи namespace для pydantic dataclasses.\n\
    - 2024-02-24 — Issue #8883: `validate_call` неправильно резолвит forward refs\
    \ из другого модуля.\n- 2024-10-10 — Issue #10591: страница документации по postponed\
    \ annotations снова признана непонятной.\n- 2024-11-18 — Issue #10877: PEP 695\
    \ + `Annotated[Enum]` ломает генерацию.\n\n**Источники**\n\n- Issue #2678 от samuelcolvin\
    \ — главный стратегический пост о проблемах PEP 563 и позиции по PEP 649 — [https://github.com/pydantic/pydantic/issues/2678](https://github.com/pydantic/pydantic/issues/2678)\n\
    - PR #348 от samuelcolvin — первая реализация поддержки postponed annotations\
    \ и `ForwardRef` — [https://github.com/pydantic/pydantic/pull/348](https://github.com/pydantic/pydantic/pull/348)\n\
    - Issue #234 от buhman — оригинальное сообщение о неработающем `ForwardRef` —\
    \ [https://github.com/pydantic/pydantic/issues/234](https://github.com/pydantic/pydantic/issues/234)\n\
    - Issue #248 от buhman — пример падения с `Optional[Foo]` под future annotations\
    \ — [https://github.com/pydantic/pydantic/issues/248](https://github.com/pydantic/pydantic/issues/248)\n\
    - PR #2761 от jameysharp — фикс резолва NamedTuple/TypedDict через `__module__`\
    \ — [https://github.com/pydantic/pydantic/pull/2761](https://github.com/pydantic/pydantic/pull/2761)\n\
    - PR #8209 от alexmojaki — `eval_type_backport` для PEP 604 union в старых Python\
    \ — [https://github.com/pydantic/pydantic/pull/8209](https://github.com/pydantic/pydantic/pull/8209)\n\
    - PR #8513 от sydney-runkle — фикс namespace для dataclass + future annotations\
    \ — [https://github.com/pydantic/pydantic/pull/8513](https://github.com/pydantic/pydantic/pull/8513)\n\
    - Issue #8883 от mwalsh161 — провал `validate_call` с future annotations в другом\
    \ модуле — [https://github.com/pydantic/pydantic/issues/8883](https://github.com/pydantic/pydantic/issues/8883)"
