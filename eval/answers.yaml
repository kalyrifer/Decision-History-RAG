- id: G05
  question: Почему из pydantic v2 убрали copy_on_model_validation?
  expected_summary: Поведение копирования при валидации вложенных моделей вызывало
    путаницу и баги (unexpected deep copies); в v2 семантику упростили (модели переиспользуются
    как есть), что отразили в migration guide (#7608 — жалоба на неполноту документирования).
  answer: "Краткая стратегическая сводка: в Pydantic V2 конфигурация `copy_on_model_validation`\
    \ была полностью удалена, потому что в новой архитектуре (на основе `pydantic-core`\
    \ и Rust-валидатора) копирование происходит детерминированно и контролируемо на\
    \ уровне самой модели через метод `model_copy(update=..., deep=...)`, а старое\
    \ «неявное» копирование при валидации вложенных моделей создавало больше проблем,\
    \ чем решало.\n\n**Главные причины решения**\n\n1. **Неявное поведение приводило\
    \ к непредсказуемым багам**\n   - Пользователи путались, когда их вложенные модели\
    \ «внезапно» копировались или, наоборот, не копировались.\n   - Конфиг `copy_on_model_validation`\
    \ исторически был источником регрессий: например, после PR #3201 shallow-копия\
    \ перестала учитывать include/exclude (Issue #3195, коммит 5ad73d0), а после PR\
    \ #3642 наоборот — копия стала глубокой, что сломало пользовательский код (Issue\
    \ #4092).\n   - PrettyWood в PR #3642: *\"Regression introduced in samuelcolvin/pydantic#3201.\
    \ Config.copy_on_model_validation used to do in fact a deep copy because we used\
    \ to call Model.dict() and then do a shallow copy. Now that we use directly .__dict__,\
    \ we should do a deep one\"*.\n\n2. **Документация и контракт поведения размывались**\n\
    \   - Поведение `copy_on_model_validation` плохо было описано: в Issue #4369 (gdalmau,\
    \ 2022-08-12) пользователь жалуется: *\"The latest release v1.9.2 introduced changes\
    \ in the configuration option copy_on_model_validation which are not reflected\
    \ in the documentation\"*. Существующая документация описывала только то, *что*\
    \ копируется, но не *когда* и *как*.\n   - В Issue #3284 (assaf-orca, 2021-10-03)\
    \ обнаружено, что флаг даже не работает для `@validate_arguments`: id объекта\
    \ внутри декоратора отличается от id снаружи, несмотря на явную установку `copy_on_model_validation=False`.\
    \ Автор: *\"I think with the decorator validate_arguments it's need to be same\
    \ as the original python behavior, but if it doesn't the config should support\
    \ it\"*.\n\n3. **В V2 копирование стало явным и явный API лучше неявного**\n \
    \  - В V1 копирование происходило «само» при валидации, что ломалось в сценариях\
    \ `model.copy(update=...)` для вложенных моделей (Issue #418 от dgasmith, 2019-03-14:\
    \ *\"Currently calling copy with update= does not validate the updated data\"\
    *; Issue #1874; Issue #7387 от slafs, 2023-09-10).\n   - В V2 введён явный метод\
    \ `model_copy(update=..., deep=...)`, который даёт пользователю полный контроль.\
    \ Автор antazoey в Issue #7608 (2023-09-25) пишет: *\"there is no mention of the\
    \ config removal of copy_on_model_validation in the guide... it warns me the item\
    \ was removed\"*. Это прямое подтверждение, что конфиг был удалён намеренно при\
    \ миграции.\n\n**Хронология**\n\n- 2019-03-14 — Issue #418: dgasmith сообщает,\
    \ что `copy(update=)` не валидирует данные, и предлагает использовать `__init__`\
    \ вместо `construct` — предпосылка для будущего редизайна копирования.\n- 2020-03-30\
    \ — Issue #1351: подтверждено, что `copy` не запускает никакую валидацию (ни типов,\
    \ ни кастомную).\n- 2020-08-26 — Issue #1874: bofm показывает, что `A(s='s').copy(update={'s':\
    \ object()})` не вызывает `ValidationError` — неявное копирование без проверок.\n\
    - 2021-10-03 — Issue #3284: обнаружено, что `copy_on_model_validation` не действует\
    \ на `@validate_arguments`.\n- 2021-12-19 — Коммит 5ad73d0 (Eric Jolibois): *\"\
    Small regression in #2231. The shallow copy done with Config.copy_on_model_validation\
    \ = True ... was using excluded / included fields when it should just copy everything\"\
    * — закрывает #3195.\n- 2022-01-08 — Issue #3641: в v1.9.0 поведение `copy_on_model_validation`\
    \ для `List` полей снова сломалось.\n- 2022-01-09 — PR #3642 (PrettyWood): перевод\
    \ shallow-копии в deep-копию; в Issue #4092 (2022-05-19) это ломает пользовательский\
    \ код.\n- 2022-08-12 — Issue #4369: документация по `copy_on_model_validation`\
    \ не отражает реальное поведение.\n- 2023-09-10 — Issue #7387 (slafs): v1-трюк\
    \ `parse_obj` для починки вложенных моделей после `copy(update=)` больше не работает\
    \ в v2.\n- 2023-09-25 — Issue #7608 (antazoey): пользователь не может найти в\
    \ migration guide упоминания удаления `copy_on_model_validation` — явное свидетельство\
    \ намеренного удаления.\n\n**Источники**\n\n- Issue о миграции, указывающий на\
    \ удаление `copy_on_model_validation` в V2 — https://github.com/pydantic/pydantic/issues/7608\n\
    - Issue о регрессии `copy_on_model_validation` для List-полей в v1.9.0 — https://github.com/pydantic/pydantic/issues/3641\n\
    - PR, переводящий shallow-копию в deep-копию (контекст «почему конфиг был хрупким»)\
    \ — https://github.com/pydantic/pydantic/pull/3642\n- Коммит, исправляющий регрессию\
    \ с include/exclude при копировании — https://github.com/pydantic/pydantic/commit/5ad73d0388bce63a1365d183cd05b01a95b445bf\n\
    - Issue о неработающем `copy_on_model_validation` в `@validate_arguments` — https://github.com/pydantic/pydantic/issues/3284\n\
    - Issue о проблемах `model.copy(update=...)` с вложенными моделями в V2 — https://github.com/pydantic/pydantic/issues/7387\n\
    - Issue о несоответствии документации реальному поведению `copy_on_model_validation`\
    \ — https://github.com/pydantic/pydantic/issues/4369\n- Issue о невалидации данных\
    \ в `copy(update=...)` в V1 (историческая предпосылка редизайна) — https://github.com/pydantic/pydantic/issues/418"
