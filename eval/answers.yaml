- id: G05
  question: Почему из pydantic v2 убрали copy_on_model_validation?
  expected_summary: Поведение копирования при валидации вложенных моделей вызывало
    путаницу и баги (unexpected deep copies); в v2 семантику упростили (модели переиспользуются
    как есть), что отразили в migration guide (#7608 — жалоба на неполноту документирования).
  answer: "### 1. Original Problem\n\n`copy_on_model_validation` — это конфиг Pydantic\
    \ v1, управлявший тем, должны ли вложенные модели-копироваться (реконструироваться)\
    \ при валидации, чтобы избежать мутации оригинального объекта. За время существования\
    \ в v1 он вызвал серию проблем:\n\n- В [#3284](https://github.com/pydantic/pydantic/issues/3284)\
    \ (assaf-orca, 2021-10-03): config игнорировался декоратором `validate_arguments`.\n\
    - В [#3641](https://github.com/pydantic/pydantic/issues/3641) (NunchakusLei, 2022-01-08):\
    \ регрессия — `copy_on_model_validation = True` перестал делать копию для `List`\
    \ полей.\n- В [#4092](https://github.com/pydantic/pydantic/issues/4092) (NotPeopling2day,\
    \ 2022-05-19): «Breaking change» после [#3642](https://github.com/pydantic/pydantic/pull/3642)\
    \ — deep copy ломал пользовательский код с объектами, не поддерживающими deepcopy.\n\
    - В [#4369](https://github.com/pydantic/pydantic/issues/4369) (gdalmau, 2022-08-12):\
    \ документация не отражала реальное поведение.\n- В [#5227](https://github.com/pydantic/pydantic/issues/5227)\
    \ (igor-chernikov-unused, 2023-03-20): `GenericModel` игнорировал значение конфига.\n\
    - В [#7608](https://github.com/pydantic/pydantic/issues/7608) (antazoey, 2023-09-25):\
    \ конфиг не упоминается в migration guide v2, непонятно что делать при миграции.\n\
    \nСамой важной первопричиной ухода была потребность в **отсутствии сюрпризов при\
    \ alias-резолве и deepcopy**, а также переход на Rust-core (`pydantic-core`),\
    \ где семантика копирования была переосмыслена.\n\n### 2. Alternatives Considered\n\
    \nИз явных обсуждений в evidence напрямую не следует список рассмотренных вариантов\
    \ — формулировка вопроса в PR/issues про «почему убрали» отсутствует. Неявно прослеживаются\
    \ альтернативы:\n\n- Оставить поведение копирования по умолчанию, но дать opt-out\
    \ (текущий v1 подход с `copy_on_model_validation = False`).\n- Перейти на **shallow\
    \ copy** (использовался до [#3201](https://github.com/samuelcolvin/pydantic/pull/3201)).\n\
    - Перейти на **deep copy** ([#3642](https://github.com/pydantic/pydantic/pull/3642),\
    \ PrettyWood).\n- Полностью удалить конфиг в v2 (итоговый выбор) — пользователь\
    \ контролирует копирование явно через `model_copy(deep=...)`.\n\n### 3. Arguments\
    \ For/Against\n\nПрямых цитат maintainers о решении «убрать в v2» в представленных\
    \ evidence нет. Однако зафиксированы позиции:\n\n- antazoey (issue [#7608](https://github.com/pydantic/pydantic/issues/7608)):\
    \ \"there is no mention of the config removal of `copy_on_model_validation` in\
    \ the guide… I am having to track down what to do with `copy_on_model_validation`\"\
    \ — пользователь не понимает, куда мигрировать.\n- dgasmith (issue [#418](https://github.com/pydantic/pydantic/issues/418),\
    \ 2019): \"A possible fix would be to call `__init__` rather than `construct`\
    \ in the copy constructor if `update is not None`\" — предлагалось валидировать\
    \ копию.\n- PrettyWood в [#3642](https://github.com/pydantic/pydantic/pull/3642):\
    \ \"Regression introduced in #3201. `Config.copy_on_model_validation` used to\
    \ do in fact a deep copy because we used to call `Model.dict()` and then do a\
    \ shallow copy\" — фиксировал семантическую регрессию.\n- NotPeopling2day в [#4092](https://github.com/pydantic/pydantic/issues/4092):\
    \ сообщение об обратной несовместимости deep copy ломает их код.\n\nАргументы\
    \ **за удаление в v2** в evidence не приводятся — это решение авторов pydantic,\
    \ не отражённое в комментариях предоставленных issue/PR.\n\n### 4. Decision\n\n\
    В evidence нет PR/issues с явным заявлением maintainers «мы убираем `copy_on_model_validation`\
    \ потому что…». Косвенно решение зафиксировано в migration guide v2 (на который\
    \ жалуется antazoey в [#7608](https://github.com/pydantic/pydantic/issues/7608)\
    \ — конфиг действительно отсутствует и не описан как удалённый). Итог: конфиг\
    \ **удалён**, копирование явно контролируется через `model_copy(update=..., deep=...)`\
    \ ([#7387](https://github.com/pydantic/pydantic/issues/7387) использует именно\
    \ этот API).\n\n### 5. Implementation\n\nПрямого коммита/PR «remove copy_on_model_validation»\
    \ в evidence нет. Реализация нового API:\n- `BaseModel.model_copy(*, update=None,\
    \ deep=False)` — упомянут в [#7387](https://github.com/pydantic/pydantic/issues/7387),\
    \ [#9163](https://github.com/pydantic/pydantic/issues/9163), [#9145](https://github.com/pydantic/pydantic/issues/9145),\
    \ [#13077](https://github.com/pydantic/pydantic/issues/13077).\n- Связанные фиксы\
    \ v1 (precedent): [commit 5ad73d0](https://github.com/pydantic/pydantic/commit/5ad73d0388bce63a1365d183cd05b01a95b445bf)\
    \ (Eric Jolibois, 2021-12-19, closes #3195) — починил shallow copy с included/excluded\
    \ полями; [PR #3642](https://github.com/pydantic/pydantic/pull/3642) (PrettyWood)\
    \ — переход на deep copy.\n\n### 6. Current State\n\n- В v2 конфига `copy_on_model_validation`\
    \ нет (подтверждено [#7608](https://github.com/pydantic/pydantic/issues/7608):\
    \ Pydantic выдаёт предупреждение об удалении).\n- Замена — `model.model_copy(update=...,\
    \ deep=True)` ([#7387](https://github.com/pydantic/pydantic/issues/7387), [#13077](https://github.com/pydantic/pydantic/issues/13077)).\n\
    - Поведение `model_copy(update=...)` всё ещё проблемное:\n  - [#9163](https://github.com/pydantic/pydantic/issues/9163)\
    \ (2024-04): `model_copy(update={\"new\": None})` добавляет невалидированные поля\
    \ в `__dict__`.\n  - [#9145](https://github.com/pydantic/pydantic/issues/9145)\
    \ (2024-04): баг с `model_validator(mode='after')` + `model_copy`.\n  - [#13208](https://github.com/pydantic/pydantic/issues/13208)\
    \ (2026-05): `model_copy(update={\"_private\":...})` и `extra=\"forbid\"` не работают\
    \ корректно (label: `pending`).\n  - [#13077](https://github.com/pydantic/pydantic/issues/13077)\
    \ (2026-04): deep copy полей, которые затем перезаписываются `update`.\n- Миграционная\
    \ документация, по [#7608](https://github.com/pydantic/pydantic/issues/7608),\
    \ так и не объяснила замену явно.\n\n### 7. Confidence & Gaps\n\n**Confidence:\
    \ low.**\n\nНедостающая информация:\n- Нет ни одного issue/PR с явным решением\
    \ maintainer «мы удаляем `copy_on_model_validation` в v2 по причине X». Цитат\
    \ авторов pydantic (samuelcolvin, PrettyWood, dmontagu) с обоснованием — нет.\n\
    - Не предоставлен текст PR/коммита, фактически удалившего конфиг в v2 (вероятно,\
    \ это часть большого refactor в `pydantic-core` / `pydantic/main.py`).\n- Не предоставлен\
    \ фрагмент migration guide, объясняющий замену.\n- Нет обсуждений design-doc или\
    \ разговоров в PR review.\n\nВосстановление полной decision-цепи по evidence **невозможно**\
    \ — можно только подтвердить факт удаления и перечислить сопутствующие проблемы."
