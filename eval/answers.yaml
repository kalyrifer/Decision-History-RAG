- id: G06
  question: Почему .dict() ограничен JSON-совместимыми значениями и почему появился
    model_dump()?
  expected_summary: Требование сериализуемости результата dict() конфликтовало с желанием
    сохранять произвольные Python-объекты (#1409); в v2 развели model_dump()/model_dump_json()
    с явным режимом python/json.
  answer: "### 1. Original Problem\n\nВ Pydantic v1 метод `.dict()` возвращал словарь\
    \ с **Python-совместимыми** значениями (datetime-объекты, Decimal-объекты, namedtuple,\
    \ Enum-инстансы и т. д.), а `.json()` возвращал строку. Пользователи неоднократно\
    \ просили возможность получить из `.dict()` структуру, пригодную для дальнейшей\
    \ JSON-сериализации (см. https://github.com/pydantic/pydantic/issues/1409, автор\
    \ wozniakty, 2020-04-20: «it would be nice if we could have some way for `.dict()`\
    \ to return a serializable format by default»). Одновременно в V1 `dict()` можно\
    \ было переопределить на уровне отдельной модели и использовать per-model настройки\
    \ сериализации (см. https://github.com/pydantic/pydantic/issues/6718, optimalstrategy,\
    \ 2023-07-17). Также существовала давняя просьба развести «рабочее» поведение\
    \ модели и сериализацию для enum: https://github.com/pydantic/pydantic/issues/1917\
    \ (ThibaultLemaire, 2020-09-10 — «use_enum_values but only on .dict()»).\n\nПри\
    \ разработке V2 потребовалось: (а) ввести явное разделение между python- и json-режимами\
    \ дампа; (б) централизовать/унифицировать логику сериализации (ранее per-model\
    \ override терялся); (в) добавить управляемый параметр `mode` и убрать смешение\
    \ «модель и её сериализация».\n\n### 2. Alternatives Considered\n\n- Оставить\
    \ одноимённый `.dict()` и внутри него неявно менять поведение (отвергнуто — ломает\
    \ обратную совместимость).\n- Сохранить V1-поведение, когда вложенная модель может\
    \ переопределять `dict()` со своими kwargs (отвергнуто как несовместимое с унифицированным\
    \ ядром pydantic-core; см. https://github.com/pydantic/pydantic/issues/6718).\n\
    - Расширить существующий `.json()` опциями — отвергнуто, так как не покрывает\
    \ python-режим.\n- Ввести отдельное API: `model_dump()` / `model_dump_json()`\
    \ с параметрами `mode='python'|'json'` и набором флагов (`include`, `exclude`,\
    \ `exclude_unset`, `exclude_defaults`, `exclude_none`, `by_alias`, `round_trip`)\
    \ — выбрано.\n\n### 3. Arguments For/Against\n\n- За разделение python/json и\
    \ явный параметр `mode`:\n  - whao89 (https://github.com/pydantic/pydantic/issues/10037,\
    \ 2024-08-02): «I'm expecting that the NaN behavior of `model_dump_json()` and\
    \ `model_dump(mode=\"json\")` to be the same. The dictionary output of `model_dump(mode=\"\
    json\")` is not strictly JSON serializable.»\n  - wozniakty (https://github.com/pydantic/pydantic/issues/1409,\
    \ 2020-04-20): «I want to still have my pydantic model define the fields as a\
    \ datetime, but I want the `.dict` step to convert those into a string format.»\n\
    - За централизацию (per-call kwargs рекурсивно спускаются во вложенные модели):\n\
    \  - optimalstrategy (https://github.com/pydantic/pydantic/issues/6718, 2023-07-17):\
    \ «In Pydantic V2, it appears that `model_dump()` now serializes the entire schema\
    \ using the settings given to the root call to `model_dump`.»\n- За отдельное\
    \ «dump-only» поведение для enum (без глобального `use_enum_values`):\n  - ThibaultLemaire\
    \ (https://github.com/pydantic/pydantic/issues/1917, 2020-09-10): «The `use_enum_values`\
    \ config option is indeed nice when serializing. But it's not so nice when working\
    \ with the model in the code.»\n- Против «молчаливого» JSON-режима в `.dict()`:\n\
    \  - Общий консенсус (отражён в https://github.com/pydantic/pydantic/issues/6718\
    \ и обсуждениях вокруг computed_field https://github.com/pydantic/pydantic/issues/7048,\
    \ Rossco8, 2023-08-08 — поведение `model_dump` и `model_dump_json` должно быть\
    \ предсказуемо и задокументировано, а не «магически» меняться).\n\n### 4. Decision\n\
    \nВыбрана модель: в V2 `.dict()` и `.json()` помечены как устаревшие; вместо них\
    \ введены `model_dump(*, mode='python'|'json', include=..., exclude=..., exclude_unset=...,\
    \ exclude_defaults=..., exclude_none=..., by_alias=..., round_trip=...)` и `model_dump_json(...)`.\
    \ Поведение явно расщеплено:\n- `mode='python'` (по умолчанию в `model_dump`)\
    \ — максимально сохраняет Python-типы (Decimal остаётся Decimal, datetime — datetime,\
    \ namedtuple остаётся namedtuple-проблематика зафиксирована).\n- `mode='json'`\
    \ — приводит значения к JSON-совместимому виду (Decimal→str, datetime→isoformat\
    \ и т. д.).\n- `model_dump_json()` всегда использует json-режим и сериализует\
    \ через pydantic-core / orjson.\n\nЭто явно следует из жалоб на расхождение поведения\
    \ (https://github.com/pydantic/pydantic/issues/10037, https://github.com/pydantic/pydantic/issues/7048)\
    \ и из описания PR, развивающих API: https://github.com/pydantic/pydantic/pull/12830\
    \ (hztBUAA, 2026-02-20) добавляет `exclude_if` сразу к `model_dump`, `model_dump_json`,\
    \ `TypeAdapter.dump_python`, `TypeAdapter.dump_json` — что подтверждает двух-API\
    \ (`dump_python`/`dump_json`) подход.\n\n### 5. Implementation\n\n- Реализовано\
    \ в рамках релиза Pydantic v2 в `pydantic-core` (сериализатор на Rust с режимами\
    \ `python`/`json`) и в Python-обёртке `BaseModel.model_dump` / `BaseModel.model_dump_json`\
    \ (см. ссылку на исходник в https://github.com/pydantic/pydantic/issues/8620,\
    \ laundmo, 2024-01-24 — указывает на `pydantic/main.py:293` и `pydantic/root_model.py:135`).\n\
    - Конкретный PR, вводящий API в v2, в предоставленных блоках не указан; в доказательной\
    \ базе — лишь описание публичного API и баги, которые им чинятся/обнаруживаются\
    \ (https://github.com/pydantic/pydantic/issues/6606, https://github.com/pydantic/pydantic/issues/6795,\
    \ https://github.com/pydantic/pydantic/issues/7048, https://github.com/pydantic/pydantic/issues/7257,\
    \ https://github.com/pydantic/pydantic/issues/7345, https://github.com/pydantic/pydantic/issues/7431,\
    \ https://github.com/pydantic/pydantic/issues/7433, https://github.com/pydantic/pydantic/issues/8168).\n\
    - Расширения API: https://github.com/pydantic/pydantic/pull/12830 — добавление\
    \ `exclude_if`.\n\n### 6. Current State\n\n- `.dict()`/`.json()` помечены deprecated,\
    \ в пользу `model_dump` / `model_dump_json`.\n- `model_dump` имеет параметр `mode`,\
    \ `model_dump_json` всегда работает в json-режиме.\n- Известные открытые расхождения\
    \ (по состоянию на даты issue):\n  - Несовпадение `model_dump(mode=\"json\")`\
    \ и `model_dump_json()` по NaN: https://github.com/pydantic/pydantic/issues/10037\
    \ (открыт на момент evidence, 2024-08-02).\n  - Несимметричное поведение exclude\
    \ у computed_field между двумя методами: https://github.com/pydantic/pydantic/issues/7048.\n\
    \  - dict[Enum, ...] и dict[IntEnum, ...] теряют тип ключа в json: https://github.com/pydantic/pydantic/issues/6795,\
    \ https://github.com/pydantic/pydantic/issues/7257, https://github.com/pydantic/pydantic/issues/8168.\n\
    \  - namedtuple деградирует до tuple в python-режиме: https://github.com/pydantic/pydantic/issues/7433.\n\
    \  - Кастомные типы (наследники namedtuple) теряют тип в python-режиме: https://github.com/pydantic/pydantic/issues/7431.\n\
    \  - `RootModel[list[TypeVar]]` с bound=BaseModel даёт пустые dict'ы: https://github.com/pydantic/pydantic/issues/7345.\n\
    \  - Неверный type-hint возврата у `RootModel.model_dump`: https://github.com/pydantic/pydantic/issues/8620.\n\
    \  - `model_json_schema` сериализует примеры, что ломается на несериализуемых\
    \ объектах: https://github.com/pydantic/pydantic/issues/7807.\n- Развитие продолжается:\
    \ в 2026 добавлен `exclude_if` (https://github.com/pydantic/pydantic/pull/12830).\n\
    \n### 7. Confidence & Gaps\n\nConfidence: **medium**.\n\nНедостающая информация:\n\
    - Не предоставлен конкретный PR/коммит, вводящий `model_dump` / `model_dump_json`\
    \ в Pydantic v2 (дизайн-решение принималось Samuel Colvin и командой при переходе\
    \ v1→v2, но соответствующие issue/PR в evidence отсутствуют).\n- Не даны цитаты\
    \ мейнтейнеров (samuelcolvin, davidhewitt, lig) с обоснованием именно расщепления\
    \ `mode='python'|'json'`; известны лишь баг-репорты пользователей и последующие\
    \ улучшения (например, PR 12830).\n- Внутренние обсуждения альтернатив (single-method\
    \ vs two-method) не попали в выборку.\n- Нет прямого ответа, почему `.dict()`\
    \ в v1 был ограничен именно Python-типами — это историческое решение, отражённое\
    \ лишь косвенно через реквесты вроде #1409 и #1917."
