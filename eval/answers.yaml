- id: G01
  question: Почему ядро pydantic переписали с Cython на Rust в версии 2?
  expected_summary: Cython-сборки были громоздкими (проблемы с флагами компиляции
    и размером), при v2 ядро выделили в отдельный пакет pydantic-core на Rust ради
    скорости валидации; обязательность Rust-компонента вызывала споры (портативность,
    Lambda), но выбор остался из-за производительности.
  answer: "Pydantic V2 заменил Cython на Rust внутри отдельного пакета `pydantic-core`,\
    \ чтобы получить прирост производительности и упростить развитие критического\
    \ ядра, пожертвовав при этом переносимостью двоичных wheel-ов и усложнив сборку\
    \ из исходников.\n\n**Главные причины решения**\n\n1. **Производительность и контроль\
    \ над горячими путями валидации**\n   Cython давал умеренное ускорение (~10% по\
    \ замерам dmontagu в PR 553), но Rust позволяет тоньше контролировать аллокации,\
    \ сериализацию и работу со схемами. В PR 12415 прямо упоминается, что `pydantic-core`\
    \ и `pydantic` «heavily coupled» и узкое место — быстрый выпуск обновлений ядра;\
    \ нативный код на Rust оказался удобнее развивать именно как отдельный «core»-пакет,\
    \ а не как часть монолитного дерева.\n\n2. **Жёсткое версионирование и вынужденная\
    \ синхронизация релизов**\n   Начиная с Pydantic V2, `pydantic` требует точно\
    \ запиненную версию `pydantic-core` (видно в issue 12526: `pydantic-core==2.41.5`).\
    \ Это раздражало пользователей (issue 6450) и ломало dev-цикл: правка в `pydantic-core`\
    \ требовала отдельного релиза на PyPI, что задокументировано как основная боль\
    \ в PR 12415.\n   - Зависимости-боты (например, dependabot) могли «протащить»\
    \ несовместимую версию core.\n   - Дублировались тесты между двумя репозиториями.\n\
    \   - История изменений core плохо попадала в общий HISTORY проекта.\n\n3. **Отказ\
    \ от Cython из-за его операционных проблем**\n   В issue 584 установка Pydantic\
    \ без Cython приводила к `AttributeError: module 'cython' has no attribute 'compiled'`.\
    \ Дополнительно issue 2276 фиксирует огромную разницу в размере артефактов pip\
    \ vs conda (80M против 6.6M), а issue 555 — отсутствие precompiled-биндингов под\
    \ macOS/Windows. Эти боли мотивировали полностью уйти от модели «опциональная\
    \ Cython-компиляция из исходников».\n   - Cython требовал отдельной среды сборки\
    \ и ломал импорт при её отсутствии.\n   - Размер и переносимость собранных `.so`/`.pyd`\
    \ файлов были неудовлетворительными.\n\n4. **Перенос тяжёлой нативной части в\
    \ Rust для будущей монолитизации**\n   В PR 12415 davidhewitt явно пишет: «In\
    \ V3, I would quite like to see `pydantic-core` no longer published as a standalone\
    \ package». Идея — оставить только Python-обёртку `pydantic`, а Rust-код развивать\
    \ в том же дереве. Это позже реализовали через `git subtree` (PR 12423, 12431,\
    \ 12436, 12481), и Rust-репозиторий `pydantic-core` был архивирован.\n\n**Хронология**\n\
    \n- 2019-05-26 — samuelcolvin анонсирует переход на компилируемое ядро и просит\
    \ помочь с prebuilt-бинарниками под macOS/Windows (issue 555).\n- 2019-06-09 —\
    \ сообщение об ошибке `module 'cython' has no attribute 'compiled'` при импорте\
    \ pydantic без установленного Cython (issue 584).\n- 2021-01-20 — жалоба на 80M\
    \ артефакт `pip install pydantic` против 6.6M у conda (issue 2276).\n- 2022-11-26\
    \ — KOLANICH требует убрать обязательный Rust-компонент, перечислив проблемы toolchain,\
    \ колес и статической линковки (issue 4790).\n- 2023-07-05 — фиксируется жёсткий\
    \ пин `pydantic-core==2.0.2` при наличии 2.1.2 на PyPI (issue 6450).\n- 2023-07-10\
    \ — `No module named 'pydantic_core._pydantic_core'` в AWS Lambda (issue 6557).\n\
    - 2025-08-25 — ImportError `validate_core_schema` из-за рассинхронизации core\
    \ и pydantic (issue 12189).\n- 2025-10-17 — PR 12415 с предложением импортировать\
    \ `pydantic-core` в дерево `pydantic` через squash-коммит.\n- 2025-10-19 — PR\
    \ 12423: первая попытка `git subtree add --prefix=pydantic-core ... main`.\n-\
    \ 2025-10-20 — PR 12431: импорт с переписанными commit message, содержащими `Original-commit-hash`.\n\
    - 2025-10-22 — PR 12436: пересборка импорта с обратными ссылками `pydantic/pydantic-core#N`\
    \ и `Original-commit-link`.\n- 2025-11-05 — PR 12481: финальный импорт на базе\
    \ HEAD `pydantic-core` 2.41.5, план архивирования внешнего репозитория.\n- 2025-11-07\
    \ — PR 12496: `uv` автоматически пересобирает `pydantic-core` после правок Rust-кода.\n\
    - 2025-11-10 — PR 12508: dependabot бампает `rust-url` уже внутри дерева `pydantic-core`.\n\
    - 2025-11-12 — фиксируется проблема локальной разработки через `pyproject.toml`-пин\
    \ (issue 12526).\n- 2026-01-28 — PR 12752: миграция CI `pydantic-core` в основной\
    \ `ci.yml`, бамп MSRV до 1.88 и pyodide до 0.28.x.\n- 2026-03-31 — issue 13005:\
    \ на Windows cpython 3.14 у `pydantic-core` 2.43+ нет колес, что заставляет пользователей\
    \ собирать из исходников.\n- 2026-04-14 — issue 13071: после архивирования внешнего\
    \ `pydantic-core` Arch Linux не может привязаться к тегу для pydantic 2.13.0/pydantic-core\
    \ 2.46.0.\n\n**Источники**\n\n- Мотивация «вынести Rust-ядро и потом слить обратно\
    \ в monorepo» — [PR 12415 «import pydantic-core 2.41.4 in-tree (with CI adjustments)»](https://github.com/pydantic/pydantic/pull/12415).\n\
    - Проблемы с обязательным Rust-компонентом (toolchain, колеса, статическая линковка)\
    \ — [issue 4790 «Get rid of mandatory Rust-implemented component»](https://github.com/pydantic/pydantic/issues/4790).\n\
    - Практические последствия Rust-ядра: отсутствие wheels под Windows cpython 3.14\
    \ — [issue 13005 «Pydantic-core 2.43+ missing wheels. Windows cpython 3.14»](https://github.com/pydantic/pydantic/issues/13005).\n\
    - Проблемы, на которые Pydantic V2 отвечал: ошибки импорта без Cython — [issue\
    \ 584 «module 'cython' has no attribute 'compiled'»](https://github.com/pydantic/pydantic/issues/584);\
    \ раздутые бинарники — [issue 2276 «Change default cython flags to have smaller\
    \ compiled files»](https://github.com/pydantic/pydantic/issues/2276); отсутствие\
    \ прекомпилированных бинарников — [issue 555 «MacOS and windows pre-compiles binaries»](https://github.com/pydantic/pydantic/issues/555).\n\
    - Цикл финального импорта core в дерево `pydantic` — [PR 12423 «Import pydantic-core\
    \ into pydantic tree»](https://github.com/pydantic/pydantic/pull/12423), [PR 12431\
    \ «import pydantic-core with commit messages updated»](https://github.com/pydantic/pydantic/pull/12431),\
    \ [PR 12436 «import pydantic-core with commit messages updated, try 2»](https://github.com/pydantic/pydantic/pull/12436),\
    \ [PR 12481 «Import pydantic-core into pydantic»](https://github.com/pydantic/pydantic/pull/12481).\n\
    - Архивирование внешнего репозитория и связанные с этим баги для пакетных менеджеров\
    \ — [issue 13071 «Pydantic 2.13.0: Missing tags for pydantic-core releases…»](https://github.com/pydantic/pydantic/issues/13071).\n\
    - Боль жёсткого пина core при разработке — [issue 12526 «Pydantic V2 and V2 core\
    \ local change sync issue»](https://github.com/pydantic/pydantic/issues/12526).\n\
    \n**Caveat.** В выданных блоках нет прямой публикации от мейнтейнеров с формулировкой\
    \ «мы переписали ядро V2 с Cython на Rust ради X». Описанная выше мотивация реконструирована\
    \ по косвенным свидетельствам: боли Cython (issues 584/2276/555), описание архитектурных\
    \ проблем двух репозиториев в PR 12415, и история слияния core обратно в monorepo.\
    \ Конкретные бенчмарки «Rust быстрее Cython на N%» в предоставленных блоках не\
    \ зафиксированы, поэтому про скорость Rust vs Cython я численных утверждений не\
    \ делаю."
