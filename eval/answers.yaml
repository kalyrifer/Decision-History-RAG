- id: G08
  question: Зачем в pydantic отдельный StrictBool — чем обычный bool не устроил?
  expected_summary: bool в Python является подклассом int, из-за чего lax-валидация
    пропускала числа там, где ожидался флаг; StrictBool отделил настоящие boolean
    от числовых (#579).
  answer: '### 1. Original Problem


    В pydantic обычное поле `bool` принимает практически любое значение из-за логики
    Python: `bool({"moo": 1}) == True`. Пользователь, получающий данные из внешнего
    источника (например, JSON для API), не может быть уверен, что в поле действительно
    пришёл булев тип — значение молча коэрцируется. Автор предложил либо ужесточить
    дефолтный валидатор, либо добавить отдельный «строгий» тип.


    Источник: [issue #579](https://github.com/pydantic/pydantic/issues/579) (cazgp,
    2019-06-05).


    Параллельно в [issue #578](https://github.com/pydantic/pydantic/issues/578) samuelcolvin
    зафиксировал позицию команды: pydantic — это **parsing library**, а не validation
    library, и менять дефолтное поведение `bool`/`int` не планируется.


    ### 2. Alternatives Considered


    - **Сделать `bool_validator` строгим по умолчанию** — предложено в [PR #617](https://github.com/pydantic/pydantic/pull/617)
    (dmontagu, 2019-06-23). dmontagu допускал `True/False/0/1` и YAML-строки (`''t''/''T''/''f''/''F''`,
    JSON-варианты и их `bytes`). Для обратной совместимости предлагал оставить `RelaxedBool`.

    - **Добавить отдельный `StrictBool`** — выбрано, см. ниже.

    - **Глобальный strict-mode для всей модели** — обсуждался в [issue #1098](https://github.com/pydantic/pydantic/issues/1098)
    (maxrothman, 2019-12-15) и позднее в [issue #4664](https://github.com/pydantic/pydantic/issues/4664)
    для v2 (samuelcolvin, 2022-10-27) с идеей `model_strict()` / `model_lax()`.

    - **Generic StrictType-фабрика** для создания `StrictInt`, `StrictFloat` и т.д.
    — [issue #780](https://github.com/pydantic/pydantic/issues/780) (haizaar, 2019-08-26).


    ### 3. Arguments For/Against


    - cazgp (автор запроса, [#579](https://github.com/pydantic/pydantic/issues/579)):
    «`a` should be a bool and only a bool. If a user provides any other value to the
    endpoint (using fastapi), the database throws because it''s the wrong type… I
    cannot think of a single type that can be passed to `bool(X)` that won''t return
    a boolean… This makes the validator completely useless.»

    - samuelcolvin ([#578](https://github.com/pydantic/pydantic/issues/578)): «Pydantic
    is no a validation library, it''s a parsing library. It makes no guarantee whatsoever
    about checking the form of data you give to it; instead it makes a guarantee about
    the form of data you get out of it.» — поэтому ломать дефолтное поведение `bool`
    не планируется, но добавить opt-in строгий тип — нормальный компромисс.

    - dmontagu ([PR #617](https://github.com/pydantic/pydantic/pull/617)): «This would
    be a breaking change for a very common type (if modifying `bool_validator` anyway),
    so I wouldn''t necessarily expect it to be merged prior to a 1.0 release» — аргумент
    против изменения дефолта.

    - samuelcolvin ([#4664](https://github.com/pydantic/pydantic/issues/4664)): «pydantic-core
    can switch from strict to lax mode at validation time… I very much doubt that
    will be possible in pydantic - many of the schemas will need to be different for
    strict and lax mode» — объяснение, почему глобальный strict-mode сложен.

    - Passer-Keenan ([#8863](https://github.com/pydantic/pydantic/issues/8863), 2024-02-21):
    «`"NO"` — string… validation passed… I would''ve expected this to fail… `StrictBool`
    does act as expected» — подтверждение, что `StrictBool` действительно нужен, но
    также критика того, что `bool` слишком либерален к строкам.

    - spookylukey ([#2329](https://github.com/pydantic/pydantic/issues/2329)): «if
    you are trying to tighten validation by going from `int` to `StrictInt` etc, these
    types fail as drop in replacements» — `StrictBool(False)` не проходил `isinstance(...,
    bool)`, что требовало отдельной починки (см. [PR #3885](https://github.com/pydantic/pydantic/pull/3885)).


    ### 4. Decision


    Выбран компромисс: **pydantic остаётся parsing-библиотекой с мягкой коэрцией по
    умолчанию**, но добавляется opt-in тип `StrictBool` (а позже — `StrictInt`, `StrictFloat`,
    `StrictBytes`, `StrictStr`). Решение отражено в позиции samuelcolvin в [#578](https://github.com/pydantic/pydantic/issues/578)
    и реализовано через новый тип, а не через ломание дефолтного `bool_validator`.
    PR #617, который пытался ужесточить сам `bool_validator`, не был смержен.


    ### 5. Implementation


    - [commit eb1e640](https://github.com/pydantic/pydantic/commit/eb1e640525a29f6e4358c767cf3c9232d6801b12)
    (cazgp, 2019-06-06) — добавлен `StrictBool` в `pydantic/types.py`, документация
    и тесты обновлены. Описание коммита: «StrictBool only allows booleans to be parsed.
    Any other value, no matter its truthiness, is rejected.»

    - [PR #580](https://github.com/pydantic/pydantic/pull/580) — PR cazgp, оформивший
    то же изменение: «Add a StrictBool type which only permits booleans to be parsed.»

    - [PR #873](https://github.com/pydantic/pydantic/pull/873) (dmontagu, 2019-10-07)
    — `StrictBool` помещён в `if not TYPE_CHECKING:`, чтобы mypy видел его как `bool`.
    Закрыл [#690](https://github.com/pydantic/pydantic/issues/690) про default-значения.

    - [PR #3885](https://github.com/pydantic/pydantic/pull/3885) (spookylukey, 2022-03-07)
    — `StrictBool.__new__` стал безусловно делегировать в `bool.__new__`, чтобы `isinstance(StrictBool(False),
    bool) is True`. Для v1.


    ### 6. Current State


    - `StrictBool` существует и в v1, и в v2 как часть набора `Strict*` типов.

    - В v2 добавлен глобальный strict-mode ([issue #4664](https://github.com/pydantic/pydantic/issues/4664)
    → blog post «Pydantic V2: Strict mode»), но общая коэрция по умолчанию сохранена
    — `StrictBool` остаётся opt-in.

    - Часть жалоб остаётся: [#8863](https://github.com/pydantic/pydantic/issues/8863)
    показывает, что обычный `bool` всё ещё принимает «NO» как True в v2.5.3; [#8175](https://github.com/pydantic/pydantic/issues/8175)
    и [#7294](https://github.com/pydantic/pydantic/issues/7294) отмечают отдельный
    баг сериализации bool как int в `model_dump_json`. Это не отменяет `StrictBool`,
    но показывает, что базовое поведение `bool` намеренно либеральное.


    ### 7. Confidence & Gaps


    **Confidence: high.** Цепочка «проблема → позиция pydantic как parsing-библиотеки
    → компромисс через opt-in тип → реализация StrictBool» хорошо подтверждена issue
    #578, #579, PR #580, commit eb1e640.


    **Gaps:**

    - Нет прямого комментария samuelcolvin с явным «выбираем StrictBool вместо ужесточения
    `bool_validator`» — решение реконструировано по комбинации [#578](https://github.com/pydantic/pydantic/issues/578)
    и тому факту, что был смержен PR #580, а не PR #617.

    - Не показаны дальнейшие PR на StrictInt/StrictFloat/StrictStr — известно только
    из [#780](https://github.com/pydantic/pydantic/issues/780) и [#2329](https://github.com/pydantic/pydantic/issues/2329),
    что они в итоге появились; конкретные PR-ы в выдаче отсутствуют.'
