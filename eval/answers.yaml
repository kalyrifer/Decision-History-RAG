- id: G03
  question: Почему в pydantic v2 перестали автоматически приводить int к str при валидации?
  expected_summary: 'В v2 пересмотрели lax-конверсии: int->str признан источником
    тихих ошибок и убран из дефолтного поведения; обсуждение последствий и мотивации
    в #6045.'
  answer: '### 1. Original Problem

    В Pydantic v1 `int`, `float`, `Decimal` автоматически приводились к `str` через
    `str(v)` при валидации `str`-полей. В Pydantic v2 это поведение по умолчанию исчезло,
    что вызвало волну жалоб на регрессию. Основные исходные issue:


    - [#6045](https://github.com/pydantic/pydantic/issues/6045) (vitalik, 2023-06-08)
    — продолжение [#5993](https://github.com/pydantic/pydantic/issues/5993), feature
    request на возврат авто-приведения.

    - [#6446](https://github.com/pydantic/pydantic/issues/6446) (mrenner-ML, 2023-07-05)
    — баг-репорт: документация v2 всё ещё обещает "int, float, and Decimal are coerced
    using str(v)", но поведение не работает.

    - [#6667](https://github.com/pydantic/pydantic/issues/6667) (knttakahashi, 2023-07-14)
    — то же поведение не работает даже при `strict=False`.

    - [#3747](https://github.com/pydantic/pydantic/issues/3747) (puneetugru, 2022-01-28)
    — аналогичная жалоба ещё на v1 (был авто-каст, и пользователи уже тогда зависели
    от него).


    ### 2. Alternatives Considered

    - **Полное удаление приведения** — что и сделали по умолчанию в v2 (strict-by-default
    для большинства типов).

    - **Глобальный флаг для возврата поведения v1** — обсуждалось в [#6045](https://github.com/pydantic/pydantic/issues/6045)
    (vitalik: "would be nice to have some feature to be able to turn on str parsing
    (globally?)").

    - **Поле-уровневый флаг `coerce_numbers_to_str`** — в итоге именно он был добавлен
    как `ConfigDict(coerce_numbers_to_str=True)`, см. [#8443](https://github.com/pydantic/pydantic/issues/8443).

    - **«Тихая» обратная совместимость** — отвергнута, см. [#4246](https://github.com/pydantic/pydantic/issues/4246)
    (amirhessam88): критиковал silent coercion, что в итоге и привело к ужесточению
    в v2.


    ### 3. Arguments For/Against

    - **За приведение (v1-style)**: vitalik [#6045](https://github.com/pydantic/pydantic/issues/6045):
    "this was working in pydantic v1, and was actually very handy when dealing with
    parsing data of a public API where users send messy data from JS client sides".

    - **Против silent coercion**: amirhessam88 [#4246](https://github.com/pydantic/pydantic/issues/4246):
    "I think the validators should not change the type; in a large code base that
    would lead to some bugs that cannot be found easily … truncation would happen
    at some of them and the user is not aware of it".

    - **Документация обещала, что работает**: mrenner-ML [#6446](https://github.com/pydantic/pydantic/issues/6446):
    "In the ''Standard Library Types'' documentation, it however says: ''int, float,
    and Decimal are coerced using str(v)'' … Is this a new behavior in pydantic v2
    not yet reflected in the documentation? Or a bug?".

    - **Не работает даже в lax-режиме**: knttakahashi [#6667](https://github.com/pydantic/pydantic/issues/6667):
    "str fields do not accept int value with strict mode disabled in v2".

    - **Исторический контекст ужесточения**: samuelcolvin в [PR #52](https://github.com/pydantic/pydantic/pull/52)
    (2017): "In the end, I thought about this and decided whitelisting things which
    can be coerced to strings made more sense" — направление к сужению неявных коэрсий
    было задано ещё в v1.


    ### 4. Decision

    Решение — strict-by-default в v2: `int`/`float`/`Decimal` **не** приводятся к
    `str` автоматически. Для пользователей, которым нужно старое поведение, введён
    opt-in флаг `ConfigDict(coerce_numbers_to_str=True)`. Прямая цитата автора решения
    в предоставленных блоках отсутствует, но выбранная модель отражена в issue/PR
    и в коде: см. [#8443](https://github.com/pydantic/pydantic/issues/8443) (assigned
    @Kludex) и [#6667](https://github.com/pydantic/pydantic/issues/6667) (assigned
    @dmontagu) — оба помечены `pending`/`bug V2`, что соответствует доработке `coerce_numbers_to_str`.


    ### 5. Implementation

    Прямых ссылок на PR/коммит, реализующий смену поведения и флаг `coerce_numbers_to_str`,
    в предоставленных evidence нет. Известно из issue [#8443](https://github.com/pydantic/pydantic/issues/8443),
    что флаг уже существует в `ConfigDict`, но автор сообщает о его неэффективности
    в pydantic-core 2.14.6 / pydantic 2.5.3 (баг, что `Model(value=42).value` остаётся
    числом). Конкретный фикс-PR в выданных блоках не упомянут.


    ### 6. Current State

    - В дефолте v2: `int → str` НЕ приводится (см. [#6446](https://github.com/pydantic/pydantic/issues/6446),
    [#6667](https://github.com/pydantic/pydantic/issues/6667), [#6045](https://github.com/pydantic/pydantic/issues/6045)).

    - Доступен opt-in `ConfigDict(coerce_numbers_to_str=True)`, но на декабрь 2023
    он, по сообщению [#8443](https://github.com/pydantic/pydantic/issues/8443), ещё
    не работал корректно — статус бага `pending`.

    - Документация на момент [#6446](https://github.com/pydantic/pydantic/issues/6446)
    (июль 2023) всё ещё утверждала обратное — требовалась синхронизация.

    - Параллельно обнаружились смежные регрессии strict-режима, затрагивающие ту же
    область «lax-поведения в JSON-режиме»: [#9204](https://github.com/pydantic/pydantic/issues/9204)
    (tuple из JSON не строится в strict при наличии `@model_validator`), [#8981](https://github.com/pydantic/pydantic/issues/8981)
    (tuple→list в strict), [#9549](https://github.com/pydantic/pydantic/issues/9549)
    (`UserDict` не проходит strict), [#12236](https://github.com/pydantic/pydantic/issues/12236)
    (любой `@model_validator` ломает JSON-коэрсии в strict), [#7468](https://github.com/pydantic/pydantic/issues/7468)
    (`model_validator(mode="after")` ломает `date` из JSON в strict). Все они иллюстрируют
    общий принцип: v2 — strict по умолчанию, любые коэрсии — только opt-in.


    ### 7. Confidence & Gaps

    **Confidence: medium.**

    - Уверенно: в v2 поведение изменено намеренно, в духе [#4246](https://github.com/pydantic/pydantic/issues/4246)
    и общей строгости v2; opt-in флаг существует.

    - Пробелы: нет прямой цитаты мейнтейнера, формализующей решение именно по `int
    → str` (вероятно, в [#5993](https://github.com/pydantic/pydantic/issues/5993),
    на который ссылается [#6045](https://github.com/pydantic/pydantic/issues/6045),
    но его текст в выданных блоках не приведён); нет ссылки на конкретный PR, реализовавший
    изменение и/или починивший `coerce_numbers_to_str` после [#8443](https://github.com/pydantic/pydantic/issues/8443).'
