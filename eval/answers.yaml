- id: G06
  question: Почему .dict() ограничен JSON-совместимыми значениями и почему появился
    model_dump()?
  expected_summary: Требование сериализуемости результата dict() конфликтовало с желанием
    сохранять произвольные Python-объекты (#1409); в v2 развели model_dump()/model_dump_json()
    с явным режимом python/json.
  answer: "В Pydantic V2 произошёл архитектурный раздел: `.dict()` оставлен как тонкая\
    \ V1-совместимая обёртка, которая принудительно сериализует значения в JSON-совместимые\
    \ примитивы, а вся гибкость и единая точка правды перенесена в `model_dump()`\
    \ / `model_dump_json()`. Это позволило добавить `mode=\"json\" | \"python\"`,\
    \ явные `serialize_as_any`, `context`, `by_alias` и устранить расхождения между\
    \ dict/JSON-форматами — главным мотивом стал переход на Rust-ядро (`pydantic-core`),\
    \ где сериализация выполняется единым согласованным кодом, а не разрозненными\
    \ Python-реализациями.\n\n**Главные причины решения**\n\n1. **Разделение Python-\
    \ и JSON-сериализации в едином API**\n   - В V1 `.dict()` и `.json()` были независимыми\
    \ методами с разной логикой; в V2 их заменили `model_dump(mode=\"python\" | \"\
    json\")` и `model_dump_json()`, чтобы одна и та же модель отдавала данные в нужном\
    \ представлении из одного места.\n   - Подсписок конкретных последствий:\n   \
    \  - `mode=\"python\"` сохраняет нативные Python-объекты (`datetime`, `Decimal`,\
    \ `UUID`, пользовательские типы-наследники `namedtuple`/`SplitResult` и т.п.).\n\
    \     - `mode=\"json\"` приводит значения к JSON-совместимым примитивам.\n   \
    \  - `model_dump_json()` использует исключительно JSON-путь, что устраняет баги\
    \ вроде рассинхрона `exclude_none` между двумя методами (см. ISSUE 7048).\n\n\
    2. **Гомогенизация поведения по всему дереву модели (уход от V1-переопределений)**\n\
    \   - В V1 каждый вложенный `BaseModel` мог переопределить `dict()`/`.json()`,\
    \ из-за чего корневой вызов мог игнорировать настройки (`exclude_unset` и т.д.)\
    \ на подмоделях — пользователи жаловались на непредсказуемость.\n   - В V2 сериализация\
    \ делегирована в `pydantic-core`, и `model_dump()` применяет настройки корневого\
    \ вызова ко всему графу; это упомянуто в ISSUE 6718 как осознанное изменение дизайна.\n\
    \n3. **Обратная совместимость через тонкий `.dict()`-shim**\n   - В V2 метод `.dict()`\
    \ сохранён, но это обёртка над `model_dump(mode=\"python\", ...)`, которая нормализует\
    \ результат к JSON-совместимым значениям (как и в V1), а весь новый API доступен\
    \ через `model_dump()`. Это объясняет, почему `.dict()` \"ограничен JSON-совместимыми\
    \ значениями\" — он исторически обещал именно такое поведение, а новая функциональность\
    \ вынесена наружу.\n\n**Хронология**\n\n- 2020-04-20 — ISSUE 1409: пользователь\
    \ просит, чтобы `.dict()` отдавал JSON-сериализуемый dict (предпосылка разделения\
    \ python/json).\n- 2020-09-10 — ISSUE 1917: запрос на `use_enum_values` только\
    \ при сериализации — усиливает идею, что валидация и сериализация должны быть\
    \ разделены.\n- 2023-03-28 — ISSUE 5301: несогласованность `__all__` для списков\
    \ и dicts в `.dict()` — пример V1-проблем, решённых переходом на новое API.\n\
    - 2023-07-11 — ISSUE 6606: `model_dump_json` без `indent` добавляет пробелы, не\
    \ совпадая с `json.dumps` (стимул к унификации).\n- 2023-07-17 — ISSUE 6718: фиксация\
    \ того, что `model_dump()` больше не overridable nested-моделями — осознанный\
    \ дизайн V2.\n- 2023-07-22 — ISSUE 6800: недокументированная несовместимость `.json()`\
    \ (`ensure_ascii=False`) → миграция на `model_dump_json()`.\n- 2023-08-08 — ISSUE\
    \ 7048: разное поведение `model_dump` vs `model_dump_json` с `computed_field`\
    \ — показывает необходимость единого пути сериализации.\n- 2023-09-13 — ISSUE\
    \ 7431, ISSUE 7433: `model_dump` возвращает `tuple` вместо пользовательского `namedtuple`/`SplitResult`\
    \ — намеренный эффект `mode=\"python\"`.\n- 2023-12-18 — ISSUE 8394: пользователи\
    \ просят конфиг для дефолтного `exclude_none` — следствие расширяемости нового\
    \ API.\n- 2024-01-24 — ISSUE 8620: типизация `RootModel.model_dump` расходится\
    \ с `BaseModel.model_dump` (нюанс эволюции API).\n- 2024-08-02 — ISSUE 10037:\
    \ `model_dump(mode=\"json\")` отдаёт несериализуемый `NaN` — расхождение с `model_dump_json`,\
    \ требующее доработки.\n- 2025-03-28 — ISSUE 11647: запрос на дефолтный `mode`\
    \ в `ConfigDict` — показывает, что API `model_dump` стал центральным механизмом\
    \ сериализации в V2.\n\n**Источники**\n\n- ISSUE 6718 — фиксация того, что `model_dump()`\
    \ больше не overridable nested-моделями в V2 — https://github.com/pydantic/pydantic/issues/6718\n\
    - ISSUE 7048 — различие поведения `model_dump` и `model_dump_json` для `computed_field`\
    \ — https://github.com/pydantic/pydantic/issues/7048\n- ISSUE 7431 — `model_dump`\
    \ возвращает `tuple` вместо пользовательского типа-наследника — https://github.com/pydantic/pydantic/issues/7431\n\
    - ISSUE 7433 — `model_dump(mode=\"python\")` для `NamedTuple` — https://github.com/pydantic/pydantic/issues/7433\n\
    - ISSUE 6606 — `model_dump_json` и компактность вывода — https://github.com/pydantic/pydantic/issues/6606\n\
    - ISSUE 1409 — ранний запрос на JSON-подобный `.dict()` — https://github.com/pydantic/pydantic/issues/1409\n\
    - ISSUE 10037 — расхождение `NaN` между `model_dump(mode=\"json\")` и `model_dump_json()`\
    \ — https://github.com/pydantic/pydantic/issues/10037\n- ISSUE 11647 — запрос\
    \ на дефолтный `mode` в `ConfigDict` — https://github.com/pydantic/pydantic/issues/11647"
