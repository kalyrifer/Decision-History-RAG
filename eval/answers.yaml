- id: G02
  question: Почему pydantic не использует строгий режим валидации по умолчанию?
  expected_summary: 'Сознательная философия проекта: lax-режим по умолчанию ради удобства
    работы с реальными данными, strict доступен как конфигурация (#1098); позиция
    зафиксирована в раннем issue о назначении pydantic (#578).'
  answer: '### 1. Original Problem


    The question of whether Pydantic should validate input types strictly (no coercion)
    by default — or coerce values (e.g., `"3"` → `int(3)`, `3.14` → `int(3)`) — has
    been a recurring request in the project since at least 2019. The originating tension
    is documented in https://github.com/pydantic/pydantic/issues/578, where samuelcolvin
    clarified Pydantic''s design intent.


    ### 2. Alternatives Considered


    - **Keep coercion (lax) as default**, provide separate `Strict*` types (`StrictInt`,
    `StrictFloat`, etc.) — the original V1 stance (https://github.com/pydantic/pydantic/issues/578).

    - **Global / per-model `strict` config flag** that switches all default validators
    to strict variants (https://github.com/pydantic/pydantic/issues/1098).

    - **Per-field strict override** via `Field(strict=True/False)` — implemented in
    V2 (https://github.com/pydantic/pydantic/issues/7268 shows users expect this).

    - **`model_strict()` / `model_lax()` class methods** to produce strict or lax
    variants of a model (https://github.com/pydantic/pydantic/issues/4664).

    - **Allow overriding default type validators entirely** instead of a binary strict/lax
    switch (https://github.com/pydantic/pydantic/issues/3208).

    - **Lazy build of two validators** (strict + lax) per model (https://github.com/pydantic/pydantic/issues/4664).


    ### 3. Arguments For/Against


    **For strict-by-default / strict mode:**

    - maxrothman (https://github.com/pydantic/pydantic/issues/1098): "The lack of
    this feature is the only thing keeping me from strongly recommending the use of
    Pydantic in my workplace."

    - ArtemIsmagilov (https://github.com/pydantic/pydantic/issues/11273): "I think
    it would be better for pydantic to validate this by default. This will give more
    rigor and correctness to the library. This is its philosophy."

    - Varriount (https://github.com/pydantic/pydantic/issues/3208): "a population
    of users disagree with Pydantic''s default validation logic" — argues strict mode
    alone is insufficient and prefers pluggable validators.

    - vitalik (https://github.com/pydantic/pydantic/issues/6045): int→str coercion
    "was working in pydantic v1, and was actually very handy" — wants more lenient
    coercion, not stricter; shows the user base is split.


    **Against strict-by-default (maintaining coercion as default):**

    - samuelcolvin (https://github.com/pydantic/pydantic/issues/578): "Pydantic is
    not a validation library, it''s a parsing library. It makes no guarantee whatsoever
    about checking the form of data you give to it; instead it makes a guarantee about
    the form of data you get out of it." Also: "I think this is correct and I''m not
    interested in changing it."

    - samuelcolvin on renaming APIs to reflect parsing/validation: "This is a big,
    backwards incompatible change for no material benefit but I think it''s worth
    it for clarity" — declined the rename but accepted that lax coercion is the deliberate
    design.

    - samuelcolvin in https://github.com/pydantic/pydantic/issues/4664: pydantic-core
    "can switch from strict to lax mode at validation time… however unfortunately
    I very much doubt that will be possible in pydantic - many of the schemas will
    need to be different for strict and lax mode." — i.e., strict-by-default would
    require substantial schema work.

    - Varriount (https://github.com/pydantic/pydantic/issues/3208): "''strict''-ness
    is a subjective quality… It is unlikely that a ''strict'' mode for Pydantic will
    actually satisfy all users'' definitions of ''strict''." — argues against a single
    strict default.


    ### 4. Decision


    Coercion (lax mode) remained the default. Strict behavior became opt-in per-field
    via `Field(strict=True)` and per-model via `model_config = ConfigDict(strict=True)`.
    This was articulated by samuelcolvin in https://github.com/pydantic/pydantic/issues/578
    ("I think this is correct and I''m not interested in changing it") and confirmed
    in the V2 roadmap at https://github.com/pydantic/pydantic/issues/4664, where strict
    mode was implemented as a feature toggle rather than a default change.


    ### 5. Implementation


    The evidence blocks do not include specific PR/commit URLs that implemented the
    V2 strict-mode config flag. We can confirm from issue references that:

    - V1 already had `StrictInt`/`StrictFloat`/etc. types (referenced in https://github.com/pydantic/pydantic/issues/3208).

    - V2 added `ConfigDict(strict=True)` and per-field `Field(strict=True/False)`
    — exercised in https://github.com/pydantic/pydantic/issues/7268, https://github.com/pydantic/pydantic/issues/7468,
    https://github.com/pydantic/pydantic/issues/8147, https://github.com/pydantic/pydantic/issues/9204.
    The exact implementing PRs are not present in the evidence.


    ### 6. Current State


    - Lax coercion is still the default in V2.

    - Users can opt into strictness per-model (`ConfigDict(strict=True)`) and per-field
    (`Field(strict=False)`), as shown by multiple V2 bug reports that rely on these
    knobs.

    - Outstanding bug reports show the strict-mode integration with `model_validator(mode="before"/"after"/"wrap")`
    and with types like `Path`, `UUID`, `datetime.date`, and `tuple` is still imperfect
    (https://github.com/pydantic/pydantic/issues/7268, https://github.com/pydantic/pydantic/issues/7468,
    https://github.com/pydantic/pydantic/issues/8147, https://github.com/pydantic/pydantic/issues/9204).

    - The request to make defaults themselves strictly validated (`validate_default`
    semantics made default) is still open as a philosophical/design question in https://github.com/pydantic/pydantic/issues/11273.

    - Detection of strict mode from inside third-party before/after validators (a
    long-standing feature request) remains open in https://github.com/pydantic/pydantic/issues/6802.


    ### 7. Confidence & Gaps


    **Confidence: medium.** The reasoning and decision are well-documented in samuelcolvin''s
    own words across #578 and #4664, but the specific PRs/commits that implemented
    the V2 `strict` config flag and per-field `Field(strict=…)` are not in the evidence
    set — only the resulting issues that use them. Also missing: any discussion specifically
    of *default* strictness (the user''s exact framing) in V2-era design notes; the
    evidence shows requests for it were declined or left as opt-in.'
