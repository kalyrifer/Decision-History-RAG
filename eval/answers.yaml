- id: G03
  question: Почему в pydantic v2 перестали автоматически приводить int к str при валидации?
  expected_summary: 'В v2 пересмотрели lax-конверсии: int->str признан источником
    тихих ошибок и убран из дефолтного поведения; обсуждение последствий и мотивации
    в #6045.'
  answer: "В pydantic v2 команда сознательно ужесточила поведение валидаторов, и в\
    \ режиме по умолчанию `int` больше не приводится к `str`, поскольку это считалось\
    \ «тихим» изменением типа, способным маскировать баги в больших кодовых базах.\
    \ Одновременно была сохранена возможность вернуть «lax»-поведение через опциональный\
    \ флаг `coerce_numbers_to_str` в `ConfigDict`, чтобы миграция с v1 оставалась\
    \ контролируемой.\n\n**Главные причины решения**\n\n1. **Безопасность и предсказуемость\
    \ типов**\n   - Авторы pydantic осознали, что «неявное» приведение `int`→`str`\
    \ (и аналогично `tuple`→`list`, `str`→`date` и т.д.) приводит к скрытым багам,\
    \ особенно в data-science и обёрточных моделях, где тип входа может критично влиять\
    \ на результат.\n   - amirhessam88 в #4246: «I think the `validators` should not\
    \ change the `type`; in a large code base that would lead to some bugs that cannot\
    \ be found easily… truncation would happen at some of them and the user is not\
    \ aware of it».\n   - Решение: в v2 стандартный валидатор `str` ожидает строго\
    \ строку; любое приведение должно быть явным.\n\n2. **Соответствие практике строгой\
    \ валидации (strict-by-default для стандартных типов)**\n   - В v2 движок `pydantic-core`\
    \ разделяет «python» и «json»-режимы и в первом по умолчанию не выполняет нестрогих\
    \ преобразований для базовых скаляров.\n   - knttakahashi в #6667: «str fields\
    \ do not accept int value with strict mode disabled in v2» — демонстрирует, что\
    \ даже `strict=False` не восстанавливает v1-поведение для `str`.\n   - aidanm96\
    \ в #8057: «I expected that by default (and with the `strict=False` argument included)\
    \ I would expect the `int` to be coerced to a `str` rather then resulting in a\
    \ `ValidationError`» — показывает, что у значительной части пользователей ожидания\
    \ не совпали с новой семантикой.\n\n3. **Обратная совместимость и удобство миграции\
    \ через явную опцию**\n   - Чтобы не ломать сценарии вроде парсинга «грязных»\
    \ данных из JS-клиентов, была введена опция `ConfigDict(coerce_numbers_to_str=True)`,\
    \ явно включающая старое поведение.\n   - vitalik в #6045: «this was working in\
    \ pydantic v1, and was actually very handy when dealing with parsing data of a\
    \ public API where users send messy data from JS client sides — so would be nice\
    \ to have some feature to be able to turn on str parsing (globally?)».\n   - mrenner-ML\
    \ в #6446 подтверждает, что документация v2 уже описывает `coerce_numbers_to_str=True`,\
    \ но поведение по умолчанию изменено.\n\n4. **Согласованность с давней политикой\
    \ ужесточения (исторический контекст)**\n   - Уже в 2017 году в PR #52 (samuelcolvin)\
    \ был зафиксирован принцип whitelist'а допустимых приведений к `str`: «I thought\
    \ about this and decided whitelisting things which can be coerced to strings made\
    \ more sense». В v2 эта линия была последовательно усилена: по умолчанию — никаких\
    \ неявных приведений.\n\n**Хронология**\n\n- 2017-06-21 — PR #52: «stricter str\
    \ validation», введено whitelisting'овое приведение к `str` ([PR 52](https://github.com/pydantic/pydantic/pull/52)).\n\
    - 2020-10-10 — Issue #1988: запрос на приведение моделей к валидному JSON (связанная\
    \ тема о неявных преобразованиях типов) ([Issue 1988](https://github.com/pydantic/pydantic/issues/1988)).\n\
    - 2022-01-28 — Issue #3747: жалоба на «тихое» приведение `int` к `str` в v1 при\
    \ OpenAPI-генерации ([Issue 3747](https://github.com/pydantic/pydantic/issues/3747)).\n\
    - 2022-07-17 — Issue #4246: аргумент против скрытых type-changes валидаторами\
    \ ([Issue 4246](https://github.com/pydantic/pydantic/issues/4246)).\n- 2023-04-26\
    \ — Issue #5606: dmontagu фиксирует вопрос «как получить v1-lax приведение `str`\
    \ в v2?», предлагая `field_validator` как workaround ([Issue 5606](https://github.com/pydantic/pydantic/issues/5606)).\n\
    - 2023-06-04 — Issue #5993: первый баг-репорт о регрессе `int`→`str` в v2 ([Issue\
    \ 5993](https://github.com/pydantic/pydantic/issues/5993)).\n- 2023-06-08 — Issue\
    \ #6045: запрос на глобальный флаг включения `str`-приведения ([Issue 6045](https://github.com/pydantic/pydantic/issues/6045)).\n\
    - 2023-07-05 — Issue #6446: несоответствие поведения с документацией; фиксируется\
    \ необходимость `coerce_numbers_to_str` ([Issue 6446](https://github.com/pydantic/pydantic/issues/6446)).\n\
    - 2023-07-14 — Issue #6667: подтверждено, что `strict=False` не возвращает старое\
    \ поведение для `str` ([Issue 6667](https://github.com/pydantic/pydantic/issues/6667)).\n\
    - 2023-11-08 — Issue #8057: та же проблема через `TypeAdapter` ([Issue 8057](https://github.com/pydantic/pydantic/issues/8057)).\n\
    - 2023-12-27 — Issue #8443: зафиксирован баг, что `coerce_numbers_to_str=True`\
    \ не срабатывает ([Issue 8443](https://github.com/pydantic/pydantic/issues/8443)).\n\
    \n**Источники**\n\n- Введение whitelist-приведения к `str` и обоснование «stricter\
    \ validation» — [PR 52](https://github.com/pydantic/pydantic/pull/52).\n- Аргумент\
    \ сообщества против «тихих» type-changes валидаторами — [Issue 4246](https://github.com/pydantic/pydantic/issues/4246).\n\
    - Репорт о регрессе `int`→`str` в v2 и обсуждение возврата v1-поведения — [Issue\
    \ 5993](https://github.com/pydantic/pydantic/issues/5993).\n- Запрос на глобальный\
    \ флаг `coerce_numbers_to_str` (feature request) — [Issue 6045](https://github.com/pydantic/pydantic/issues/6045).\n\
    - Несоответствие поведения v2.0.1 с документацией по `coerce_numbers_to_str` —\
    \ [Issue 6446](https://github.com/pydantic/pydantic/issues/6446).\n- Демонстрация,\
    \ что `strict=False` не восстанавливает v1-coercion для `str` — [Issue 6667](https://github.com/pydantic/pydantic/issues/6667).\n\
    - Тот же баг через `TypeAdapter` — [Issue 8057](https://github.com/pydantic/pydantic/issues/8057).\n\
    - Подтверждённый баг, что флаг `coerce_numbers_to_str=True` не работает как ожидается\
    \ — [Issue 8443](https://github.com/pydantic/pydantic/issues/8443).\n\n> **Замечание\
    \ о полноте доказательств:** в предоставленных блоках отсутствуют прямые ссылки\
    \ на конкретный PR/коммит, в котором в v2 был удалён неявный `int`→`str` coercion\
    \ и добавлен параметр `coerce_numbers_to_str`. Вывод о причине решения сделан\
    \ на основании серии баг-репортов и обсуждений сообщества, которые фиксируют как\
    \ саму регрессию, так и обоснование нового поведения со стороны мейнтейнеров (dmontagu,\
    \ Kludex)."
