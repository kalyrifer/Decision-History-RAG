- id: G07
  question: Как pydantic решил проблему PEP 563 (postponed annotations) и почему именно
    так?
  expected_summary: 'Постponed evaluation ломал интроспекцию аннотаций; позиция мейнтейнеров
    — работать через resolve_annotations и требовать локальные ссылки, аргументация
    в длинном треде #2678.'
  answer: '### 1. Original Problem

    PEP 563 («Postponed Evaluation of Annotations», `from __future__ import annotations`)
    делает все аннотации строками, а не объектами. В pydantic попытки вычислять их
    через `typing.get_type_hints()` работали лишь частично: приводили к ошибкам и
    сильному замедлению. Особенно остро проблема встала, когда PEP 563 собирались
    сделать поведением по умолчанию в Python 3.10, а отключить это стало невозможно.
    Отправная точка — баг/feature-request https://github.com/pydantic/pydantic/issues/234
    (ForwardRef) и https://github.com/pydantic/pydantic/issues/248 (postponed annotations),
    а также сводный тред https://github.com/pydantic/pydantic/issues/2678.


    ### 2. Alternatives Considered

    - **PEP 563 как есть** — отложенные строки, вычисляемые по необходимости (с хаками
    вокруг `get_type_hints()`).

    - **PEP 649 (Larry Hastings)** — ленивая материализация `__annotations__`: аннотации
    остаются объектами, но вычисляются только при доступе.

    - **Полностью своя реализация `get_type_hints()`** в pydantic (упоминается в PR
    https://github.com/pydantic/pydantic/pull/348 как «beyond the scope»).

    - **Перенос логики в Rust/pydantic-core** для ускорения резолвинга (обсуждается
    в #2678).


    ### 3. Arguments For/Against

    - samuelcolvin (https://github.com/pydantic/pydantic/issues/2678): «trying to
    evaluate those strings to get the real annotation objects is really hard, perhaps
    impossible to always do correctly… Even if `typing.get_type_hints()` was faultless,
    it would still be massively slower than the current semantics or PEP 649».

    - samuelcolvin (там же): PEP 649 — «best of both worlds», поскольку аннотации
    остаются полноценными объектами, но без штрафа в момент определения класса.

    - samuelcolvin (https://github.com/pydantic/pydantic/issues/248): для базового
    случая self-reference достаточно вызова `typing.get_type_hints()`.

    - jameysharp (https://github.com/pydantic/pydantic/issues/2760): показывает, что
    даже в v1 PEP 563 ломает `NamedTuple`/`TypedDict`, потому что нет `update_forward_refs`
    на них.

    - theenglishway (https://github.com/pydantic/pydantic/issues/486): существующая
    документация по postponed annotations путает пользователей — примеры не демонстрируют
    forward references.


    ### 4. Decision

    Была принята стратегия: в pydantic v1 поддерживать PEP 563 через `update_forward_refs()`
    и хуки вокруг `get_type_hints()`, а на уровне языка продвигать PEP 649 как долгосрочное
    решение, отменяющее превращение аннотаций в строки. В pydantic v2 модель данных
    и резолвинг были переписаны и перенесены в `pydantic-core` на Rust, что радикально
    ускорило обработку строковых аннотаций. Итог зафиксирован в #2678: «this has been
    resolved by a changes in python 3.10 from the python steering council» — поведение
    PEP 563 не стало обязательным в 3.10.


    ### 5. Implementation

    - https://github.com/pydantic/pydantic/pull/348 + коммит https://github.com/pydantic/pydantic/commit/25b5d980306685957e3905a4f93c87cd8a3527b8
    — начальная поддержка PEP 563 и `ForwardRef` в Python 3.7 (добавлены `update_forward_refs`,
    примеры `forward_ref.py` и `postponed_annotations.py`).

    - https://github.com/pydantic/pydantic/pull/2761 — фикс `NamedTuple`/`TypedDict`
    под postponed annotations.

    - https://github.com/pydantic/pydantic/pull/8209 — введён `eval_type_backport`
    (через пакет alexmojaki/eval_type_backport), решает проблемы с `int | str` и PEP
    604 union на старых Python (закрывает https://github.com/pydantic/pydantic/issues/7873).


    ### 6. Current State

    - В Python 3.10+ PEP 563 не стал поведением по умолчанию, а затем был фактически
    отложен/отменён в пользу PEP 649. Это сняло риск массовых поломок, обозначенный
    в #2678.

    - В pydantic v2 резолвинг аннотаций выполняется в Rust-ядре, поэтому строковые
    аннотации обрабатываются быстро; на https://docs.pydantic.dev/latest/concepts/postponed_annotations/
    есть отдельная страница, посвящённая этой теме (https://github.com/pydantic/pydantic/issues/10591
    фиксирует, что документация всё ещё местами путает пользователей).

    - Тем не менее остаются открытые баги: потеря метаданных `Field` из `Annotated`
    при `update_forward_refs` (https://github.com/pydantic/pydantic/issues/3282),
    проблемы с `validate_call` и кросс-модульными forward refs (https://github.com/pydantic/pydantic/issues/8883,
    https://github.com/pydantic/pydantic/issues/8475), а также с PEP 695 `type` +
    `Enum` (https://github.com/pydantic/pydantic/issues/10877).


    ### 7. Confidence & Gaps

    Уверенность: средняя. Сводный тред #2678 усечён в выдаче, поэтому точные цитаты
    о финальном голосовании steering council и о внутренних дискуссиях по переносу
    логики в Rust недоступны. Не хватает явного подтверждения, кто именно и когда
    принял решение о переходе на pydantic-core именно из-за проблем PEP 563 — это
    приходится выводить косвенно по PR 8209 и наличию страницы документации.'
