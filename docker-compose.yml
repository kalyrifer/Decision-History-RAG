services:
  db:
    image: pgvector/pgvector:pg16
    container_name: decision-rag-db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: decision_rag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d decision_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
